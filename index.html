/* ---------- exercise builders ---------- */
function poolBefore(l){ // words of this and earlier lessons (for distractors)
  var out = [];
  for (var i=0;i<=l.gi;i++) allWords(LESSONS[i]).forEach(function(w){ out.push(wordObj(w, LESSONS[i])); });
  return out;
}
function distract(correct, pool, field, n){
  var seen = {}; seen[correct[field]] = 1;
  var near = pool.filter(function(p){ return p.lid === correct.lid; });
  var far = pool.filter(function(p){ return p.lid !== correct.lid; });
  var out = [];
  shuffle(near).concat(shuffle(far)).forEach(function(p){
    if (out.length < n && !seen[p[field]] && p.ar.replace(HARAKAT,"") !== correct.ar.replace(HARAKAT,"")){ seen[p[field]] = 1; out.push(p); }
  });
  return out;
}
function qArTr(w, pool){ return {k:"Anlamını seç", type:"mc", say:w.ar, prompt:AR(w.ar)+TL(w.tl), opts:shuffle([w].concat(distract(w,pool,"tr",3))).map(function(o){ return {html:esc(o.tr), ok:o===w}; }), ans:w}; }
function qTrAr(w, pool){ return {k:"Arapçasını seç", type:"mc", prompt:'<span class="big">'+esc(w.tr)+'</span>', opts:shuffle([w].concat(distract(w,pool,"ar",3))).map(function(o){ return {html:AR(o.ar)+TL(o.tl), ok:o===w, say:o.ar}; }), ans:w}; }
function qListen(w, pool){ return {k:"Dinle ve seç", type:"mc", say:w.ar, autoplay:true, sayTl:w.tl, prompt:'<button class="btn alt" data-say="'+esc(w.ar)+'" data-tl="'+esc(w.tl)+'">'+SPK+' Tekrar dinle</button><span class="muted small">Duyduğun kelimeyi seç (okunuşa da bakabilirsin).</span>', opts:shuffle([w].concat(distract(w,pool,"ar",3))).map(function(o){ return {html:AR(o.ar)+TL(o.tl), ok:o===w}; }), ans:w}; }
function qType(w){ return {k:"Okunuşunu yaz", type:"type", say:w.ar, prompt:'<span class="big">'+esc(w.tr)+'</span><span class="muted small">Arapçasının okunuşunu Latin harfleriyle yaz.</span>', ans:w}; }
function qMatch(ws){ return {k:"Eşleştir", type:"match", items:ws}; }
function qOrder(s){
  var a = s.ar.split(/\s+/), t = s.tl.split(/\s+/);
  var pair = a.length === t.length;
  var toks = a.map(function(x, i){ return {ar:x, tl: pair ? t[i] : "", i:i}; });
  return {k:"Cümleyi kur", type:"order", prompt:'<span class="big">'+esc(s.tr)+'</span>'+(pair?"":'<span class="muted small">'+esc(s.tl)+'</span>'), toks:toks, ans:s};
}
function orderable(s){ var n = s.ar.split(/\s+/).length; return n >= 2 && n <= 9; }
function buildPractice(l){
  var pool = poolBefore(l);
  var ws = l.words.map(function(w){ return wordObj(w, l); });
  var qs = [];
  shuffle(ws).forEach(function(w, i){ qs.push(i % 2 ? qTrAr(w, pool) : qArTr(w, pool)); });
  pick(ws, 3).forEach(function(w){ qs.push(qListen(w, pool)); });
  pick(ws.filter(function(w){ return w.tl.replace(/[^a-zA-Zçğışöüâîûḥḫṣḍṭẓ]/g,"").length >= 2; }), 2).forEach(function(w){ qs.push(qType(w)); });
  var ss = sentences(l).filter(orderable);
  pick(ss, 3).forEach(function(s){ qs.push(qOrder(s)); });
  if (l.ek) pick(l.ek.map(function(w){ return wordObj(w, l); }), 3).forEach(function(w){ qs.push(qArTr(w, pool)); });
  qs = shuffle(qs);
  qs.splice(Math.min(3, qs.length), 0, qMatch(pick(ws, Math.min(5, ws.length))));
  return qs;
}
function buildExam(l){
  var pool = poolBefore(l);
  var ws = l.words.map(function(w){ return wordObj(w, l); });
  var qs = [];
  shuffle(ws).forEach(function(w, i){ var r = i % 4; qs.push(r===0?qTrAr(w,pool):r===1?qArTr(w,pool):r===2?qListen(w,pool):qTrAr(w,pool)); });
  qs = qs.slice(0, 7);
  pick(sentences(l).filter(orderable), 3).forEach(function(s){ qs.push(qOrder(s)); });
  var tw = ws.filter(function(w){ return w.tl.replace(/[^a-zA-Zçğışöüâîûḥḫṣḍṭẓ]/g,"").length >= 2; });
  if (tw.length) qs.push(qType(pick(tw,1)[0]));
  while (qs.length < 10){ var w = pick(ws,1)[0]; qs.push(qArTr(w, pool)); }
  return shuffle(qs);
}
function buildStageExam(st){
  var last = st.lessons[st.lessons.length-1];
  var pool = poolBefore(last);
  var ws = [], ss = [];
  st.lessons.forEach(function(l){ l.words.forEach(function(w){ ws.push(wordObj(w,l)); }); sentences(l).filter(orderable).forEach(function(s){ ss.push(s); }); });
  var qs = [];
  pick(ws, 15).forEach(function(w, i){ var r = i % 3; qs.push(r===0?qTrAr(w,pool):r===1?qArTr(w,pool):qListen(w,pool)); });
  pick(ss, 4).forEach(function(s){ qs.push(qOrder(s)); });
  var tw = ws.filter(function(w){ return w.tl.replace(/[^a-zA-Zçğışöüâîûḥḫṣḍṭẓ]/g,"").length >= 2; });
  if (tw.length) qs.push(qType(pick(tw,1)[0]));
  return shuffle(qs);
}

/* ---------- answer normalising for typed answers ---------- */
function norm(s){
  s = String(s).toLowerCase().trim();
  s = s.replace(/sh/g,"ş").replace(/kh/g,"ḫ").replace(/gh/g,"ğ").replace(/ch/g,"ş");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ç/g,"c").replace(/[öo]/g,"o").replace(/[üu]/g,"u").replace(/ḫ/g,"h").replace(/x/g,"h").replace(/7/g,"h").replace(/5/g,"h");
  s = s.replace(/[ʿʾ'’`ʼ32]/g,"").replace(/ee/g,"i").replace(/oo/g,"u").replace(/[^a-z]/g,"");
  s = s.replace(/(.)\1+/g,"$1");
  s = s.replace(/e/g,"a");
  return s;
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j; for(i=0;i<=m;i++){d[i]=[i];} for(j=0;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function typedOk(input, w){
  var alts = w.tl.split(/\s*\/\s*/);
  var a = norm(input); if (!a) return 0;
  for (var i=0;i<alts.length;i++){
    var b = norm(alts[i]);
    if (a === b) return 2;
    if (b.length >= 5 && lev(a,b) <= 1) return 1;
  }
  return 0;
}

/* ---------- quiz runner ---------- */
var Q = null;
function startQuiz(host, qs, mode, opts){
  Q = {host:host, qs:qs, i:0, right:0, mode:mode, answered:false, opts:opts||{}};
  renderQ();
}
function renderQ(){
  var q = Q.qs[Q.i], host = Q.host;
  Q.answered = false;
  var head = '<div class="qhead"><div class="prog" aria-hidden="true"><i style="width:'+Math.round(100*Q.i/Q.qs.length)+'%"></i></div><span class="small muted">'+(Q.i+1)+' / '+Q.qs.length+'</span></div>';
  var title = Q.mode==="exam" ? "Ders sınavı · geçmek için %80" : Q.mode==="stage" ? "Aşama sınavı · geçmek için %80" : "Alıştırma";
  var h = '<div class="panel"><div class="qkind">'+title+' — '+esc(q.k)+'</div>'+head;
  if (q.type === "mc"){
    h += '<div class="prompt">'+q.prompt+'</div><div class="opts">';
    q.opts.forEach(function(o, i){ h += '<button class="opt" data-opt="'+i+'">'+o.html+'</button>'; });
    h += '</div>';
  } else if (q.type === "type"){
    h += '<div class="prompt">'+q.prompt+'</div><form id="tform" class="row" autocomplete="off"><input class="inp" id="tinput" type="text" spellcheck="false" autocapitalize="off" placeholder="ör. marḥaba ya da marhaba" aria-label="Okunuş"><button class="btn" type="submit">Kontrol et</button></form>';
  } else if (q.type === "match"){
    var L = shuffle(q.items), R = shuffle(q.items);
    q._left = L; q._right = R; q._done = 0; q._miss = 0;
    h += '<p class="muted small">Arapça kelimeye, sonra anlamına dokun.</p><div class="match"><div class="col">';
    L.forEach(function(w, i){ h += '<button class="opt" data-ml="'+i+'">'+AR(w.ar)+TL(w.tl)+'</button>'; });
    h += '</div><div class="col">';
    R.forEach(function(w, i){ h += '<button class="opt" data-mr="'+i+'">'+esc(w.tr)+'</button>'; });
    h += '</div></div>';
  } else if (q.type === "order"){
    q._bank = shuffle(q.toks); q._ans = [];
    h += '<div class="prompt">'+q.prompt+'</div><div class="answer" id="oans" aria-label="Cevabın"></div><div class="bank" id="obank"></div><div class="row"><button class="btn" id="ocheck" disabled>Kontrol et</button><button class="btn ghost" id="oclear">Temizle</button></div>';
  }
  h += '<div id="fb"></div></div>';
  host.innerHTML = h;
  if (q.type === "order") drawOrder();
  if (q.type === "type") setTimeout(function(){ var i=$("#tinput"); if(i) i.focus(); }, 50);
  if (q.autoplay) setTimeout(function(){ say(q.say, q.sayTl); }, 250);
}
function drawOrder(){
  var q = Q.qs[Q.i];
  function chip(t, attr){ return '<button class="chip" '+attr+'>'+AR(t.ar)+(t.tl&&state.settings.translit?'<span class="tl">'+esc(t.tl)+'</span>':"")+'</button>'; }
  $("#oans").innerHTML = q._ans.map(function(t, i){ return chip(t, 'data-oa="'+i+'"'); }).join("");
  $("#obank").innerHTML = q._bank.map(function(t, i){ return chip(t, 'data-ob="'+i+'"'); }).join("");
  $("#ocheck").disabled = q._bank.length > 0;
}
function feedback(ok, q, extra){
  Q.answered = true;
  if (ok) Q.right++;
  var a = q.ans;
  var sol = a ? (AR(a.ar)+' <span class="tl">'+esc(a.tl)+'</span> — '+esc(a.tr)) : "";
  $("#fb").innerHTML = '<div class="feedback '+(ok?"ok":"no")+'"><b>'+(ok?(extra||"Doğru!"):"Yanlış")+'</b>'+(sol?'<div>'+sol+'</div>':'')+
    '</div><div class="row" style="margin-top:10px"><button class="btn" id="qnext">'+(Q.i+1<Q.qs.length?"Sonraki →":"Sonucu gör")+'</button>'+(a?spk(a.ar, a.tl):"")+'</div>';
  var nb = $("#qnext"); if (nb) nb.focus();
}
function nextQ(){
  Q.i++;
  if (Q.i < Q.qs.length) return renderQ();
  finishQuiz();
}
function finishQuiz(){
  var pct = Math.round(100 * Q.right / Q.qs.length);
  var host = Q.host, h;
  if (Q.mode === "practice"){
    addXP(Q.right); save(); header();

    } else {
      h = '<div class="panel result"><div class="pct">%'+pct+'</div><h2>Biraz daha çalışalım</h2><p>Geçmek için en az %80 gerekiyor. Kelimeleri ve diyaloğu tekrar gözden geçirip sınava yeniden gir.</p>'+

    var st = Q.opts.stage;

      var f = !state.exams[st.id];
      state.exams[st.id] = Math.max(pct, state.exams[st.id]||0); addXP(f?50:10); save(); header();
      var ns = STAGES[st.index+1];
      h = '<div class="panel result"><div class="pct">%'+pct+'</div><h2>'+esc(st.title)+' aşamasını bitirdin!</h2>'+
        (ns?'<p>Sıradaki aşama açıldı: <b>'+esc(ns.title)+'</b>.</p><div class="row"><button class="btn warm" data-open="l:'+ns.lessons[0].id+'">'+esc(ns.level)+' ile devam et →</button></div>':'<p>Kursun tamamını bitirdin. Mabrūk! مبروك</p><div class="row"><button class="btn" data-go="home">Ders haritası</button></div>')+'</div>';
    } else {
      h = '<div class="panel result"><div class="pct">%'+pct+'</div><h2>Aşama sınavı geçilemedi</h2><p>%80 gerekiyor. Tekrar destesini çalış, zorlandığın dersleri yeniden gözden geçir ve tekrar dene.</p><div class="row"><button class="btn" data-open="x:'+st.id+'">Yeniden dene</button><button class="btn ghost" data-go="review">Tekrar destesi</button></div></div>';

function openStageExam(id){

var R = null;
function viewReview(){

function drawReview(){
  var h = '<div class="wrap"><div class="lhead"><h1>Tekrar destesi</h1><p class="muted">Aralıklı tekrar: bildiğin kelime daha seyrek, bilemediğin daha sık karşına çıkar (1, 3, 7, 16, 35 gün).</p></div>';

    h += '<div class="panel"><b>Bugün için tekrar yok.</b><p class="muted">'+(total ? ("Destende "+total+" kelime var. Yarın yeni kartlar gelecek.") : "Bir dersi bitirdiğinde o dersin kelimeleri buraya eklenir.")+'</p><div class="row"><button class="btn" data-go="home">Derse devam et</button></div></div>';
  } else if (R.i >= R.list.length){
    h += '<div class="panel result"><div class="pct">'+R.ok+' / '+R.list.length+'</div><p>Bugünkü tekrar bitti.</p><button class="btn" data-go="home">Ders haritası</button></div>';
  } else {

    if (R.shown){
      h += front ? (TL(w[1])+'<b>'+esc(w[2])+'</b>') : (AR(w[0])+TL(w[1])+spk(w[0], w[1]));
      if (w[3]) h += '<span class="muted small">'+esc(w[3])+'</span>';
      h += '<div class="row" style="justify-content:center"><button class="btn danger" data-rv="0">Bilemedim</button><button class="btn" data-rv="1">Bildim</button></div>';
    } else h += '<button class="btn alt" id="rshow">Cevabı göster</button>';
    h += '<span class="small muted">Kutu '+it.s.b+' / 5 · '+esc(it.l.t)+'</span></div>';

function rate(ok){
  var it = R.list[R.i], s = it.s;
  s.b = ok ? Math.min(5, s.b+1) : 1;
  s.d = today() + (ok ? INTERVALS[s.b] : 1);
  if (ok){ R.ok++; addXP(1); }
  save(); header();
  R.i++; R.shown = false; drawReview();
}

/* ---------- sohbet partneri (Claude) ---------- */
var CHAT = {turns:[], view:[], busy:false, ctl:null, sample:undefined};
try { var cs = JSON.parse(localStorage.getItem("yalla-sami-chat") || "null"); if (cs && cs.turns){ CHAT.turns = cs.turns; CHAT.view = cs.view || []; } } catch(e){}
function saveChat(){ try { localStorage.setItem("yalla-sami-chat", JSON.stringify({turns:CHAT.turns.slice(-30), view:CHAT.view.slice(-30)})); } catch(e){} }
if (window.claude && window.claude.use){ window.claude.use("sample").then(function(s){ CHAT.sample = s; if (document.querySelector("#chatbox")) viewChat(); }).catch(function(){ CHAT.sample = null; }); }
else CHAT.sample = null;
var TOPICS = ["Tanışma","Kafede sipariş","Çarşıda pazarlık","Yol sorma","Taksi","Hafta sonu planı","Ailen","Doktorda","Hayallerin","Şam’daki anıların"];
function learnerLevel(){
  var nt = nextTarget(), st = nt ? (nt.lesson ? nt.lesson.stage : nt.exam) : STAGES[STAGES.length-1];
  var done = LESSONS.filter(isDone).map(function(l){ return l.t; });
  return {level: st.level, title: st.title, done: done.slice(-12)};
}
function chatRules(){
  var lv = learnerLevel();
  return "Sen 'Yalla Şami' uygulamasında Türk bir öğrencinin Şam (Levant) Arapçası sohbet partnerisin.\n" +
    "KURALLAR:\n- Sadece Şam günlük Arapçası (ʿâmmiyye) konuş, asla Fusha (standart Arapça) kullanma. Örn. şû, wên, halla', biddi, ʿam, raḥ, kîfak, mnîḥ.\n" +
    "- Öğrencinin seviyesi: " + lv.level + " (" + lv.title + "). Son bitirdiği dersler: " + (lv.done.join(", ") || "henüz yok, yeni başlıyor") + ". Kelime ve dilbilgisini bu seviyeye göre seç; A1 ve öncesinde çok kısa ve basit cümleler kur.\n" +
    "- Her cevabın 1-3 kısa cümle olsun ve sohbeti sürdürmek için çoğunlukla bir soruyla bitsin.\n" +
    "- Öğrenci Arap harfleriyle ya da Latin harfleriyle (okunuşla) yazabilir. Mesajında hata varsa 'duzeltme' alanında Türkçe, kısa ve nazikçe doğrusunu göster (doğru Arapça + okunuş). Hata yoksa 'duzeltme' boş olsun.\n" +
    "- Öğrenci Türkçe yazarsa ya da takılırsa Türkçe kısa bir ipucu verip Arapça devam et.\n" +
    "- Okunuşu şu sistemle yaz: uzun ünlüler â î û ê ô; ع = ʿ; hemze ve Şam’daki ق = '; ح = ḥ; خ = ḫ; غ = ğ; ش = ş; ج = j; kalın harfler ṣ ḍ ṭ ẓ.\n" +
    "- YALNIZCA şu biçimde JSON döndür: {\"duzeltme\": \"...\", \"ar\": \"Arap harfleriyle Şam ağzı cevabın\", \"tl\": \"okunuşu\", \"tr\": \"Türkçe çevirisi\"}";
}
function chatBubble(v){
  if (v.role === "user") return '<div class="msg me"><div>'+esc(v.text)+'</div></div>';
  if (v.err) return '<div class="msg bot err">'+esc(v.err)+'</div>';
  var h = '<div class="msg bot">';
  if (v.duzeltme) h += '<div class="note"><b>Düzeltme.</b> '+esc(v.duzeltme)+'</div>';
  h += '<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start">'+AR(v.ar)+spk(v.ar, v.tl)+'</div>'+TL(v.tl)+'<div class="tr">'+esc(v.tr)+'</div></div>';
  return h;
}
function viewChat(){
  setNav("chat");
  var h = '<div class="wrap"><div class="lhead"><h1>Sohbet</h1><p class="muted">Claude ile Şam ağzında yazışarak konuşma pratiği yap. Seviyene göre konuşur, hatalarını Türkçe düzeltir. Arap harfleriyle ya da okunuşla (ör. «ana mnîḥ, w inta?») yazabilirsin.</p></div>';
  if (CHAT.sample === null){
    h += '<div class="panel"><b>Sohbet bu görünümde kullanılamıyor.</b><p class="muted">Sohbet partneri yalnızca uygulama claude.ai içinde açıldığında ve Claude kullanımına izin verildiğinde çalışır. Bu arada derslerdeki «Konuşma» adımıyla sesli pratik yapabilirsin.</p></div></div>';
    app.innerHTML = h; return;
  }
  h += '<div class="panel"><div class="chips">';
  TOPICS.forEach(function(tp){ h += '<button class="chip-t" data-chat-topic="'+esc(tp)+'">'+esc(tp)+'</button>'; });
  h += '</div><div id="chatbox" class="chatbox" aria-live="polite">';
  if (!CHAT.view.length) h += '<p class="muted small">Bir konu seç ya da aşağıya ilk mesajını yaz. Her cevap Claude kullanımından harcar; ilk mesajda izin istenir.</p>';
  CHAT.view.forEach(function(v){ h += chatBubble(v); });
  if (CHAT.busy) h += '<div class="msg bot muted">Yazıyor…</div>';
  h += '</div><form id="chatform" class="row" autocomplete="off"><input class="inp" id="chatin" type="text" placeholder="ör. marḥaba! kîfak?" aria-label="Mesajın" '+(CHAT.busy?"disabled":"")+'><button class="btn" type="submit" '+(CHAT.busy?"disabled":"")+'>Gönder</button>'+(CHAT.busy?'<button class="btn ghost" type="button" id="chat-stop">Durdur</button>':'')+'</form>'+
    (CHAT.view.length ? '<div class="row"><button class="btn ghost small" id="chat-clear">Yeni sohbet</button></div>' : '')+'</div></div>';
  app.innerHTML = h;
  var box = $("#chatbox"); box.scrollTop = box.scrollHeight;
  var inp = $("#chatin"); if (inp && !CHAT.busy) inp.focus();
}
function chatSend(text){
  text = String(text || "").trim();
  if (!text || CHAT.busy || !CHAT.sample) return;
  CHAT.turns.push({role:"user", content:text});
  CHAT.view.push({role:"user", text:text.replace(/^\[Konu: (.+?)\] .*$/, "Konu: $1")});
  CHAT.busy = true; CHAT.ctl = new AbortController(); viewChat();
  var input = [{role:"user", content:chatRules()}].concat(CHAT.turns.slice(-16));
  CHAT.sample.json(input, {cache:false, signal:CHAT.ctl.signal}).then(function(r){
    if (!r || typeof r.ar !== "string") throw {code:"invalid_json"};
    var v = {role:"bot", duzeltme: String(r.duzeltme||""), ar: r.ar, tl: String(r.tl||""), tr: String(r.tr||"")};
    CHAT.turns.push({role:"assistant", content: JSON.stringify(r)});
    CHAT.view.push(v);
    CHAT.busy = false; saveChat(); viewChat();
    if (v.ar) say(v.ar, v.tl);
  }).catch(function(e){
    CHAT.busy = false;
    var c = e && e.code, msg;
    if (c === "cancelled") msg = null;
    else if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled" || c === "not_declared"){ CHAT.sample = null; msg = null; }
    else if (c === "rate_limited") msg = "Şu an çok fazla istek var ya da kullanım sınırına ulaşıldı. Biraz sonra tekrar dene.";
    else if (c === "invalid_json") msg = "Cevap okunamadı. Mesajını tekrar gönder.";
    else msg = "Bağlantı sorunu oldu. Mesajını tekrar gönder.";
    if (msg) CHAT.view.push({role:"bot", err: msg});
    CHAT.turns.pop(); // başarısız mesajı geçmişten çıkar
    viewChat();
  });
}
app.addEventListener("submit", function(e){
  if (e.target.id !== "chatform") return;
  e.preventDefault();
  var v = $("#chatin").value; $("#chatin").value = ""; chatSend(v);
});
function route(){
  var h = (location.hash||"").replace("#","");

  else go("home");
}
app.addEventListener("click", function(e){
  var t = e.target;
  var b;
  if ((b = t.closest("[data-locked]"))){ toast("Kilitli. Sıradaki dersi tamamlayınca açılır."); return; }
  if ((b = t.closest("[data-open]"))){ var v = b.getAttribute("data-open"); if (v[0]==="l") openLesson(v.slice(2)); else openStageExam(v.slice(2)); return; }
  if ((b = t.closest("[data-go]"))){ go(b.getAttribute("data-go")); return; }
  if ((b = t.closest("[data-step]"))){ cur.step = +b.getAttribute("data-step"); renderLesson(); return; }
  if ((b = t.closest("[data-next]"))){ cur.step++; if (cur.step >= STEPS.length) cur.step = STEPS.length-1; renderLesson(); return; }
  if ((b = t.closest("[data-redo]"))){ renderLesson(); return; }
  if (t.closest("#trtoggle")){ var hid = !document.querySelector(".line .tr").hidden; document.querySelectorAll(".line .tr").forEach(function(x){ x.hidden = hid; }); t.closest("#trtoggle").textContent = hid ? "Türkçeyi göster" : "Türkçeyi gizle"; return; }
  if (t.closest("#rshow")){ R.shown = true; drawReview(); return; }
  if ((b = t.closest("[data-rv]"))){ rate(b.getAttribute("data-rv")==="1"); return; }
  if (t.closest("#qnext")){ nextQ(); return; }
  if ((b = t.closest("[data-rprole]"))){ rpStart(+b.getAttribute("data-rprole")); return; }
  if (t.closest("[data-rpshow]")){ cur.rp.shown = true; var lx = cur.l.d[cur.rp.i]; say(lx[1], lx[2]); $("#stepbody").innerHTML = stepRole(cur.l); return; }
  if (t.closest("[data-rpnext]")){ rpAdvance(); return; }
  if (t.closest("[data-rpswap]")){ var n = speakers(cur.l).length; rpStart((cur.rp.role + 1) % n); return; }
  if (t.closest("[data-rprestart]")){ rpStart(cur.rp.role); return; }
  if (t.closest("[data-chat-topic]")){ chatSend("[Konu: " + t.closest("[data-chat-topic]").getAttribute("data-chat-topic") + "] Konuşmayı sen başlat."); return; }
  if (t.closest("#chat-stop")){ if (CHAT.ctl) CHAT.ctl.abort(); return; }
  if (t.closest("#chat-clear")){ CHAT.turns = []; CHAT.view = []; saveChat(); viewChat(); return; }
  if (!Q) return;
  var q = Q.qs[Q.i];
  if ((b = t.closest("[data-opt]")) && q.type==="mc" && !Q.answered){
    var o = q.opts[+b.getAttribute("data-opt")];
    document.querySelectorAll("[data-opt]").forEach(function(x, i){ x.disabled = true; if (q.opts[i].ok) x.classList.add("right"); });
    if (!o.ok) b.classList.add("wrong");
    feedback(o.ok, q);
    if (q.ans && !q.autoplay && o.ok) say(q.ans.ar, q.ans.tl);
    return;
  }
  if (q.type === "match"){
    if ((b = t.closest("[data-ml]"))){ if (b.classList.contains("right")) return; document.querySelectorAll("[data-ml]").forEach(function(x){ x.classList.remove("sel"); }); b.classList.add("sel"); q._sel = +b.getAttribute("data-ml"); say(q._left[q._sel].ar, q._left[q._sel].tl); return; }
    if ((b = t.closest("[data-mr]")) && q._sel != null && !b.classList.contains("right")){
      var lw = q._left[q._sel], rw = q._right[+b.getAttribute("data-mr")];
      var lb = document.querySelector('[data-ml="'+q._sel+'"]');
      if (lw === rw){ lb.classList.remove("sel"); lb.classList.add("right"); b.classList.add("right"); lb.disabled = b.disabled = true; q._done++; q._sel = null;
        if (q._done === q.items.length){ q.ans = null; feedback(q._miss <= 1, q, q._miss ? "Tamamlandı ("+q._miss+" hata)" : "Hepsi doğru!"); }
      } else { q._miss++; b.classList.add("wrong"); setTimeout(function(){ b.classList.remove("wrong"); }, 600); }
      return;
    }
  }
  if (q.type === "order" && !Q.answered){
    if ((b = t.closest("[data-ob]"))){ var tk = q._bank.splice(+b.getAttribute("data-ob"),1)[0]; q._ans.push(tk); drawOrder(); return; }
    if ((b = t.closest("[data-oa]"))){ var tk2 = q._ans.splice(+b.getAttribute("data-oa"),1)[0]; q._bank.push(tk2); drawOrder(); return; }
    if (t.closest("#oclear")){ q._bank = q._bank.concat(q._ans); q._ans = []; drawOrder(); return; }
    if (t.closest("#ocheck")){
      var got = q._ans.map(function(x){ return x.ar.replace(HARAKAT,""); }).join(" ");
      var want = q.ans.ar.replace(HARAKAT,"").split(/\s+/).join(" ");
      $("#ocheck").disabled = true;
      var ok = got === want;
      feedback(ok, q); if (ok) say(q.ans.ar, q.ans.tl);
      return;
    }
  }
});
app.addEventListener("submit", function(e){
  if (e.target.id !== "tform") return;
  e.preventDefault();
  if (!Q || Q.answered) return;
  var q = Q.qs[Q.i], r = typedOk($("#tinput").value, q.ans);
  $("#tinput").disabled = true;
  feedback(r > 0, q, r === 2 ? "Doğru!" : "Neredeyse doğru — yazımı karşılaştır");
  say(q.ans.ar, q.ans.tl);
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && $("#qnext") && document.activeElement && document.activeElement.id !== "tinput"){ e.preventDefault(); nextQ(); }
});
document.querySelector(".nav").addEventListener("click", function(e){ var b = e.target.closest("[data-go]"); if (b) go(b.getAttribute("data-go")); });
$(".brand").addEventListener("click", function(){ go("home"); });
window.addEventListener("hashchange", function(){ var h = location.hash.replace("#",""); if (h.indexOf("ders-")===0 && (!cur || cur.l.id !== h.slice(5))) route(); });

window.__yalla = { quiz: function(){ return Q; } }; // test kancası
// Bağımsız sitede Claude sohbeti yok: sekmeyi gizle.
if (window.STANDALONE){ var chatBtn = document.querySelector('.nav [data-go="chat"]'); if (chatBtn) chatBtn.hidden = true; }
route();
header();
})();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
