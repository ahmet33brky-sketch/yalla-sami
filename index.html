<body>

<style>/* Layout: a Damascene courtyard notebook — one calm column, stages marked by ablaq (striped stone) bands, lessons as tiles along the path. */
:root{
  --bg:#f3f6f5; --card:#ffffff; --ink:#18272b; --muted:#56686c; --line:#d6dfdd;
  --tile:#1c6a73; --tile-soft:#e1efef; --apricot:#d9792c; --apricot-soft:#fbead9;
  --rose:#b03d52; --rose-soft:#f8e1e5; --ok:#2f7d48; --ok-soft:#dff0e4;
  --stone:#2a3336; --stone-2:#e9e4da;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-ar:"Noto Naskh Arabic", "Amiri", "Traditional Arabic", "Arial", serif;
  --f-kufi:"Reem Kufi", "Noto Naskh Arabic", serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1719; --card:#172226; --ink:#e4ecea; --muted:#97aaa8; --line:#2a393c;
  --tile:#5db2ba; --tile-soft:#173338; --apricot:#eea25e; --apricot-soft:#3a2a1b;
  --rose:#e57b8d; --rose-soft:#3b1f25; --ok:#6cc48a; --ok-soft:#183324;
  --stone:#e4ecea; --stone-2:#2a3336; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1719; --card:#172226; --ink:#e4ecea; --muted:#97aaa8; --line:#2a393c;
  --tile:#5db2ba; --tile-soft:#173338; --apricot:#eea25e; --apricot-soft:#3a2a1b;
  --rose:#e57b8d; --rose-soft:#3b1f25; --ok:#6cc48a; --ok-soft:#183324;
  --stone:#e4ecea; --stone-2:#2a3336; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--tile)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.tl{font-style:italic;color:var(--tile)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding:10px max(16px, env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.brand .ar{font-family:var(--f-kufi);color:var(--apricot);font-size:1.3rem;line-height:1}
.stats{margin-inline-start:auto;display:flex;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats span b{color:var(--ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));display:flex;justify-content:center}
.nav .in{display:flex;gap:4px;max-width:760px;width:100%}
.nav button{flex:1;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-family:var(--f-kufi);font-size:1.15rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--tile);background:var(--tile-soft)}
.badge{background:var(--apricot);color:#fff;border-radius:99px;padding:0 6px;font-size:.7rem;margin-inline-start:2px}

/* home path */
.hero{padding:28px 0 8px;display:grid;gap:10px}
.hero .ar{font-family:var(--f-kufi);font-size:2.4rem;color:var(--tile);line-height:1.2;justify-self:start}
.continue{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.continue .grow{flex:1;min-width:0}
.stage{margin-top:34px}
.ablaq{height:14px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--stone) 0 22px,var(--stone-2) 22px 44px);opacity:.85}
.stage-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:12px 0 6px}
.stage-head .lvl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--apricot);font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--tile)}
.lessons{display:grid;gap:8px;margin-top:12px}
.lesson{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.lesson .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:700;background:var(--tile-soft);color:var(--tile)}
.lesson.done .num{background:var(--tile);color:var(--card)}
.lesson.locked{opacity:.55;cursor:not-allowed}
.lesson.locked .num{background:var(--line);color:var(--muted)}
.lesson.next{border-color:var(--apricot);box-shadow:0 0 0 2px var(--apricot-soft)}
.lesson .t{min-width:0}
.lesson .t b{display:block;font-weight:600}
.lesson .t small{color:var(--muted);display:block;line-height:1.35}
.lesson .score{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.exam{border-style:dashed}
.lesson.exam .num{font-family:var(--f-kufi)}

/* buttons */
.btn{background:var(--tile);color:var(--card);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.alt{background:var(--tile-soft);color:var(--tile)}
.btn.warm{background:var(--apricot);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rose);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{background:var(--tile-soft);color:var(--tile);border:0;border-radius:99px;width:36px;height:36px;display:inline-grid;place-items:center;flex:none}
.spk svg{width:18px;height:18px}

/* lesson view */
.lhead{padding:20px 0 6px;display:grid;gap:6px}
.crumb{font-size:.8rem;color:var(--muted);background:none;border:0;padding:0;text-align:start}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.82rem;color:var(--muted)}
.steps button.seen{color:var(--ink)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:12px;display:grid;gap:14px}
.prose{display:grid;gap:12px;max-width:65ch}
.prose ul,.prose ol{margin:0;padding-inline-start:22px;display:grid;gap:4px}
.prose .ar{font-size:1.25em}
.note{background:var(--apricot-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.note b:first-child{color:var(--apricot)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:middle}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td .ar{font-size:1.3rem}
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.word{border:1px solid var(--line);border-radius:10px;padding:12px 52px 12px 14px;display:grid;gap:2px;align-content:start;position:relative}
.word > .ar{font-size:2.1rem;line-height:1.5}
.word .spk{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px}
.word .tr{font-weight:600}
.word .nt{font-size:.82rem;color:var(--muted);line-height:1.4}
.letter-forms{display:flex;gap:10px;flex-wrap:wrap;direction:rtl;margin-top:4px}
.letter-forms span{font-family:var(--f-ar);font-size:1.6rem;background:var(--tile-soft);border-radius:8px;padding:0 10px;line-height:1.8}
.dialog{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border-bottom:1px dashed var(--line);padding-bottom:10px}
.line .who{font-weight:700;font-size:.8rem;color:var(--apricot);min-width:56px;padding-top:6px}
.line .ar{font-size:1.35rem;display:block}
.line .tr{color:var(--muted);font-size:.92rem}
.line .tr[hidden]{display:none}
.ex{display:grid;gap:2px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .ar{font-size:1.3rem}

/* exercise */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--apricot);transition:width .3s}
.qkind{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt{display:grid;gap:4px;justify-items:center;text-align:center;padding:10px 0}
.prompt .ar{font-size:2.3rem;line-height:1.6}
.prompt .big{font-size:1.35rem;font-weight:600}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-align:center;display:grid;gap:0;min-height:56px;align-content:center}
.opt .ar{font-size:1.45rem;line-height:1.6}
.opt .tl{font-size:.82rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt.sel{border-color:var(--tile);background:var(--tile-soft)}
.opt.gone{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.answer{min-height:64px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 10px;display:grid;justify-items:center;line-height:1.3}
.chip .ar{font-size:1.3rem;line-height:1.6}
.chip .tl{font-size:.72rem}
.inp{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.feedback{border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.feedback.ok{background:var(--ok-soft);color:var(--ink)}
.feedback.ok b{color:var(--ok)}
.feedback.no{background:var(--rose-soft)}
.feedback.no b{color:var(--rose)}
.result{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.result .pct{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}

/* review / dict */
.card-srs{display:grid;gap:10px;justify-items:center;text-align:center;padding:28px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.card-srs .ar{font-size:2.6rem}
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:2;background:var(--bg);padding:8px 0}
.dict{display:grid;gap:0}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.drow .ar{font-size:1.35rem;text-align:end;min-width:90px}
.drow .m{min-width:0}
.drow .m b{font-weight:600;display:block}
.boxes{display:flex;gap:3px}
.boxes i{width:7px;height:16px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--tile)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
textarea.inp{min-height:110px;font-size:.8rem;font-family:ui-monospace,Consolas,monospace}
.word.ek{border-style:dashed}
.rp-ask{background:var(--apricot-soft);border-radius:8px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-t{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;font-size:.85rem}
.chatbox{display:grid;gap:10px;max-height:60vh;overflow-y:auto;padding:4px 2px}
.msg{border-radius:12px;padding:10px 14px;max-width:88%;display:grid;gap:4px;min-width:0}
.msg.me{justify-self:end;background:var(--tile);color:var(--card)}
.msg.bot{justify-self:start;background:var(--bg);border:1px solid var(--line)}
.msg.bot .ar{font-size:1.3rem}
.msg.bot .tr{color:var(--muted);font-size:.9rem}
.msg.err{border-color:var(--rose);color:var(--rose)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header class="top"><div class="wrap"><button class="brand" type="button" aria-label="Ana sayfa"><span class="ar" lang="ar">شامي</span><b>Yalla Şami</b></button><div class="stats" id="stats"></div></div></header>
<main id="app" aria-live="polite"></main>
<nav class="nav" aria-label="Ana menü"><div class="in">
<button data-go="home" aria-current="page"><span class="ic" lang="ar">درس</span>Dersler</button>
<button data-go="review" id="nav-review"><span class="ic" lang="ar">كرّر</span><span>Tekrar <span class="badge" hidden>0</span></span></button>
<button data-go="chat"><span class="ic" lang="ar">حكي</span>Sohbet</button>
<button data-go="dict"><span class="ic" lang="ar">قاموس</span>Sözlük</button>
<button data-go="me"><span class="ic" lang="ar">أنا</span>İlerleme</button>
</div></nav>
<script>window.STAGES=[];window.STANDALONE=true;</script>
<script>
window.STAGES.push({
id:"giris", level:"Giriş", title:"Yola çıkmadan önce",
desc:"Şam Arapçasının ne olduğunu, sesleri ve bu kursta kullanılan okunuş sistemini öğren. İlk selamlaşmaların da burada.",
lessons:[
{
id:"g1", t:"Şam Arapçası nedir?", s:"Fusha ile günlük dil arasındaki fark, ilk selamlar",
intro:"<p>Arapçanın iki yüzü vardır. <b>Fusha</b> (الفصحى) gazetelerde, haberlerde, resmî yazışmada ve Kur’an’da kullanılan klasik/standart dildir. Ama hiçbir Arap evde Fusha konuşmaz. Sokakta, evde, pazarda, dizilerde konuşulan dile <b>ʿâmmiyye</b> (عامّية) yani <i>günlük dil</i> denir ve her bölgenin kendi ağzı vardır.</p><p>Bu kursta <b>Şam (Levant) Arapçası</b>nı öğreneceksin: Suriye, Lübnan, Ürdün ve Filistin’de konuşulan, birbirine çok yakın ağızlar. Merkezde <b>Şam (Dımaşk) ağzı</b> var; Lübnan, Ürdün ve Filistin farklarını yeri geldikçe göstereceğiz. Bu ağız Arap dünyasında çok iyi anlaşılır; Türkiye’de de en sık duyulan Arapça budur.</p><p>Güzel bir haber: Türkçede yüzlerce Arapça kökenli kelime var (kitap, saat, hava, kalp, dünya, vakit…). Bunları tanımak işini çok kolaylaştıracak.</p><ul><li>Her ders: <b>anlatım → kelimeler → dilbilgisi → diyalog → alıştırma → sınav</b>.</li><li>Sınavı <b>%80</b> ile geçmeden sonraki ders açılmaz. Hiçbir ders atlanamaz.</li><li>Biten her dersin kelimeleri <b>Tekrar</b> destesine girer. Her gün tekrar etmek akıcılığın sırrıdır.</li></ul>",
note:"Şam’da biriyle karşılaştığında selam vermek ve hâl hatır sormak çok önemlidir. «Kîfak?» sorusuna neredeyse her zaman «Mnîḥ, l-ḥamdilla» (İyiyim, elhamdülillah) diye cevap verilir.",
words:[
["مَرْحَبا","marḥaba","Merhaba"],
["أَهْلا","ahlan","Selam / Hoş geldin"],
["كيفَك؟","kîfak?","Nasılsın? (erkeğe)"],
["كيفِك؟","kîfik?","Nasılsın? (kadına)"],
["مْنيح","mnîḥ","İyi","Kadın için: mnîḥa (منيحة)"],
["الحَمْدِلله","l-ḥamdilla","Elhamdülillah (çok şükür)"],
["شُكْرًا","şukran","Teşekkürler"],
["كْتير","ktîr","Çok"],
["إي","ê","Evet","Şam’da en yaygın «evet». Fusha’daki naʿam da anlaşılır."],
["لأ","la'","Hayır"],
["يَلّا","yalla","Haydi"],
["مَع السَّلامة","maʿ s-salâme","Güle güle"]
],
g:{t:"Fusha ile Şam ağzı yan yana",
b:"<p>Aynı anlamı taşıyan kelimeler Fusha’da ve Şam ağzında çoğu zaman farklıdır. Bu tabloya göz at: sağdaki sütun senin öğreneceğin dil. Fusha’yı öğrenmek zorunda değilsin; sadece farkın var olduğunu bilmen yeter. Haberlerde duyduğun Arapça ile sokakta duyduğun neden farklı, artık biliyorsun.</p><p>Soru cümlelerinde Arapça ses tonu yükselir, tıpkı Türkçede olduğu gibi. Soru eki yoktur: «Kîfak» düz söylenirse bir kelime, sonu yükselirse «Nasılsın?» olur.</p>",

intro:"<p>Arapçada kısa ünlüler genellikle <b>yazılmaz</b>. Okuyan kişi kelimeyi bildiği için tahmin eder. Ama öğrenciler, çocuk kitapları ve Kur’an için harfin üstüne ya da altına küçük işaretler konur. Bunlara <b>hareke</b> denir:</p><ul><li><b>Fetha</b> <span class='ar'>بَ</span>: Harfin üstünde küçük eğik çizgi → <b>a</b> (ince harflerde e’ye yakın).</li><li><b>Kesra</b> <span class='ar'>بِ</span>: Harfin altında eğik çizgi → <b>i</b>.</li><li><b>Damme</b> <span class='ar'>بُ</span>: Harfin üstünde küçük vav → <b>u</b> (Şam’da o’ya yakın da olabilir).</li><li><b>Sükûn</b> <span class='ar'>بْ</span>: Harfin üstünde küçük daire → <b>ünlü yok</b>.</li></ul><p>Bu uygulamada kelimeleri harekeli göstereceğiz. İleride <b>İlerleme → Görünüm</b> bölümünden harekeleri kapatıp gerçek hayattaki gibi okumayı deneyebilirsin. Şam ağzında Fusha’ya göre birçok kısa ünlü <b>düşer</b>: Fusha kabîr → Şam <b>kbîr</b> (büyük).</p>",

intro:"<p>Bu derste kendini tanıtmayı öğreneceksin. Şam ağzında ad sorusu <b>şû ismak?</b> (adın ne?, erkeğe) ya da <b>şû ismik?</b> (kadına) şeklindedir. Cevap çok basit: <b>ismi …</b> (adım …).</p><p>Arapçada şimdiki zamanda <b>«olmak» fiili yoktur</b>. «Ben Türküm» demek için sadece <b>ana turki</b> (ben Türk) dersin. Türkçedeki «-im, -sin» eklerine de gerek yoktur. Bu, Arapça cümle kurmayı başta çok kolaylaştırır.</p><p>Nerelisin sorusu: <b>inta min wên?</b> (sen nereden?) Cevap: <b>ana min Turkiyya</b> (ben Türkiye’denim), <b>ana min Istanbûl</b>.</p><p>Tanışmanın sonunda <b>tşarrafna</b> (şeref duyduk / memnun oldum) denir. Cevabı <b>w ana aktar</b> (ben daha çok) ya da <b>iş-şaraf ilna</b> (şeref bizim).</p>",

intro:"<p>Şam Arapçasında sekiz şahıs zamiri vardır. Türkçeden farklı olarak <b>«sen» ve «o»</b> için erkek ve kadın ayrı kelimeler kullanılır:</p><ul><li><b>inta</b> = sen (erkek), <b>inti</b> = sen (kadın)</li><li><b>huwwe</b> = o (erkek), <b>hiyye</b> = o (kadın)</li></ul><p>Çoğulda ise ayrım yoktur: <b>niḥna</b> (biz), <b>intu</b> (siz), <b>hinne</b> (onlar).</p><p>Sıfatlar da cinsiyete uyar. Erkek biçiminin sonuna <b>-e/-a</b> eklenerek dişil yapılır: <b>mnîḥ → mnîḥa</b>, <b>taʿbân → taʿbâne</b> (yorgun). Çoğulda genellikle <b>-în</b> eklenir: <b>taʿbânîn</b>.</p><p>Bu yüzden «Nasılsın?» sorusu da üç türlüdür: <b>kîfak</b> (erkeğe), <b>kîfik</b> (kadına), <b>kîfkon</b> (topluluğa).</p>",

intro:"<p>Bu derste işaret zamirlerini ve en sık soru kelimelerini öğreniyoruz.</p><ul><li><b>hâd</b> (bu, erkek), <b>hây</b> (bu, dişil), <b>hadôl</b> (bunlar)</li><li><b>hadâk</b> (şu/o, erkek), <b>hadîk</b> (şu/o, dişil), <b>hadôlîk</b> (şunlar)</li></ul><p>Arapçada her isim ya erkek ya dişildir. Kural: sonu <b>-e/-a</b> (ة) ile bitenler genellikle dişildir: <b>hây sayyâra</b> (bu bir araba), <b>hâd bêt</b> (bu bir ev).</p><p>İşaret zamiri el- takılı isimle birlikte kullanılırsa «bu …» anlamı verir: <b>hâd il-bêt</b> = bu ev. Şam’da kısaca <b>ha-l-bêt</b> de denir.</p><p>Soru kelimeleri: <b>şû</b> (ne), <b>mîn</b> (kim), <b>wên</b> (nerede). Arapçada soru kelimesi çoğu zaman cümlenin <b>başına</b> gelir: <b>şû hâd?</b> (bu ne?), <b>mîn hây?</b> (bu kim?).</p>",

intro:"<p>11–19 arası sayılar Şam’da tek kelimeye kaynaşmıştır ve hepsi <b>-ṭaʿş</b> ile biter: <b>ḥdaʿş</b> (11), <b>ṭnaʿş</b> (12), <b>tlaṭṭaʿş</b> (13)…</p><p>Onluklar <b>-în</b> ile biter: <b>ʿişrîn</b> (20), <b>tlâtîn</b> (30), <b>arbʿîn</b> (40)… Bileşik sayılarda <b>önce birler, sonra onlar</b> söylenir (Almancadaki gibi): <b>wâḥad w ʿişrîn</b> = 21 (bir ve yirmi).</p><p>Fiyat sormak: <b>'addêş?</b> ya da <b>'addêş ḥa'' …?</b> (… ne kadar?). Suriye’de para birimi <b>lîra</b>, Lübnan’da da <b>lîra</b>, Ürdün’de <b>dînâr</b>. Para genel olarak <b>maṣâri</b> (مصاري) denir.</p><p>11 ve üstü sayılardan sonra isim <b>tekil</b> kalır: <b>ʿişrîn lîra</b> (yirmi lira), <b>miyyet lîra</b> (yüz lira).</p>",

intro:"<p>Arapçada «benim, senin, onun» anlamı isme eklenen <b>iyelik ekleriyle</b> verilir, tıpkı Türkçedeki gibi (ev-im, ev-in). Şam’da ekler şunlardır:</p><ul><li><b>-i</b> benim, <b>-ak</b> senin (erkek), <b>-ik</b> senin (kadın)</li><li><b>-o</b> onun (erkek), <b>-a</b> onun (kadın)</li><li><b>-na</b> bizim, <b>-kon</b> sizin, <b>-hon</b> onların</li></ul><p>Örnek: <b>bêt</b> (ev) → <b>bêti</b> (evim), <b>bêtak</b> (evin), <b>bêto</b> (onun evi).</p><p>Sonu <b>-e/-a</b> (ة) ile biten kelimelerde ek gelince araya <b>-t-</b> girer: <b>ʿêle</b> (aile) → <b>ʿêlti</b> (ailem), <b>sayyâra</b> → <b>sayyârti</b> (arabam).</p><p>Aile kelimeleri Şam’da Fusha’dan farklıdır: baba <b>bayy</b>, erkek kardeş <b>ḫayy</b>. Ama çocuklar babalarına genelde <b>bâba</b>, annelerine <b>mâma</b> der.</p>",

intro:"<p>Arapçada «sahip olmak» fiili yoktur. Bunun yerine <b>ʿind</b> (yanında, -de) edatı iyelik ekleriyle kullanılır: <b>ʿindi</b> = bende var / benim var.</p><ul><li><b>ʿindi sayyâra</b> = Arabam var.</li><li><b>ʿindak wlâd?</b> = Çocukların var mı?</li><li><b>mâ ʿindi wa't</b> = Vaktim yok.</li></ul><p><b>maʿ</b> (ile) ise «şu an yanımda» anlamı verir: <b>maʿi maṣâri</b> = Yanımda para var. <b>ʿindi maṣâri</b> = Param var (genel olarak, belki evde).</p><p>Olumsuzu çok kolay: başına <b>mâ</b> getir: <b>mâ ʿindi</b>, <b>mâ maʿi</b>.</p><p>Yaş sormak da bu yapıyla değil, <b>ʿumr</b> (ömür) kelimesiyle yapılır: <b>'addêş ʿumrak?</b> (kaç yaşındasın?) — <b>ʿumri ʿişrîn sene</b> (yirmi yaşındayım).</p>",

{
id:"a1-9", t:"İstemek: bidd-", s:"biddi, biddak, mâ biddi — Şam’ın en kullanışlı kelimesi",
intro:"<p><b>bidd-</b> Şam Arapçasının belki en çok kullanılan yapısıdır. «İstemek» anlamı verir ve fiil gibi çekilmez; <b>iyelik ekleri</b> alır: <b>biddi</b> (istiyorum), <b>biddak</b> (istiyorsun, erkek), <b>biddik</b> (kadın), <b>biddo</b> (istiyor, erkek)…</p><p>İki şekilde kullanılır:</p><ul><li><b>bidd- + isim</b>: <b>biddi 'ahwe</b> = Kahve istiyorum.</li><li><b>bidd- + fiil</b>: <b>biddi rûḥ</b> = Gitmek istiyorum. (Fiilleri A2’de öğreneceğiz; şimdilik birkaç kalıbı ezberle.)</li></ul><p>Olumsuzu: <b>mâ biddi</b> = istemiyorum. Soru: <b>şû biddak?</b> = Ne istiyorsun?</p><p>Kibar istek için başa <b>law samaḥt</b> (izin verirsen, erkeğe) ya da <b>min faḍlak</b> eklenir. Gelecek anlamında da kullanılır: <b>biddo yisâfir bukra</b> = Yarın yolculuğa çıkacak (çıkmak istiyor).</p>",
note:"«Şû biddak?» doğrudan bir soru olabilir; ama bir esnafın «Şû bitʾmor?» (Ne emredersin?) demesi daha kibardır. Cevap yine «biddi …» ile verilir.",

{
id:"a1-10", t:"Var / yok ve yer bildirmek", s:"fî, mâ fî, ʿa, b-, fô', taḥt, jamb…",
intro:"<p>«Var» ve «yok» için Şam’da <b>fî</b> ve <b>mâ fî</b> kullanılır:</p><ul><li><b>fî ḫubz?</b> = Ekmek var mı?</li><li><b>mâ fî mayy</b> = Su yok.</li><li><b>mâ fî muşkle</b> = Sorun yok. (Çok sık kullanılır!)</li></ul><p>Yer bildiren edatlar isimden <b>önce</b> gelir (Türkçede sonra): <b>ʿa ṭ-ṭâwle</b> = masanın üstünde / masada, <b>bi l-bêt</b> = evde.</p><p>En kısa iki edat kelimeye yapışır:</p><ul><li><b>b- / bi</b> = -de, -da (içinde): <b>bi ş-Şâm</b> = Şam’da</li><li><b>ʿa</b> (ʿala’dan) = üstünde, -e (yön): <b>ʿa l-bêt</b> = eve</li></ul><p>Diğerleri: <b>fô'</b> (üstünde), <b>taḥt</b> (altında), <b>jamb</b> (yanında), <b>'uddâm</b> (önünde), <b>wara</b> (arkasında), <b>bên</b> (arasında).</p>",

intro:"<p>Arapçada sıfat isimden <b>sonra</b> gelir: <b>bêt kbîr</b> = büyük (bir) ev. İsim belirliyse sıfat da <b>el-</b> alır: <b>il-bêt il-kbîr</b> = büyük ev (o büyük ev).</p><p>Dikkat: <b>il-bêt kbîr</b> (sıfat el- almadan) = Ev büyük (tam cümle!). Bu fark çok önemli.</p><p>Renklerin çoğu özel bir kalıpla dişil olur: <b>aḥmar → ḥamra</b> (kırmızı), <b>abyaḍ → bêḍa</b> (beyaz), <b>aswad → sôda</b> (siyah). Diğer sıfatlar ise basitçe <b>-e/-a</b> alır: <b>ḥilu → ḥilwe</b> (güzel), <b>jdîd → jdîde</b> (yeni).</p><p>Sayılabilir şeylerin çoğulu konuşmada sıklıkla <b>dişil tekil</b> sıfat alır: <b>sayyârât ḥamra</b> (kırmızı arabalar). Bu Arapçanın ilginç bir özelliğidir.</p>",

id:"a1-12", t:"Yiyecek ve içecek", s:"Şam kahvaltısı, sipariş vermek, çoğul isimler",
intro:"<p>Şam mutfağı Türk mutfağına çok yakındır; birçok yemeği zaten tanıyorsun. Bu derste kahvaltı ve günlük yiyecekleri öğreniyoruz.</p><p>Arapçada <b>çoğul</b> iki şekilde yapılır:</p><ul><li><b>Düzenli çoğul</b>: Dişil kelimelerde <b>-ât</b> (sayyâra → sayyârât), bazı erkek kelimelerde <b>-în</b> (mʿallem → mʿallmîn).</li><li><b>Kırık çoğul</b>: Kelimenin içi değişir: ktâb → kutub, walad → wlâd, bêt → byût. Bunlar ezberlenir; her yeni ismi çoğuluyla birlikte öğrenmek en iyisidir.</li></ul><p>Yiyecek isimlerinin bir kısmı <b>topluluk ismidir</b>: <b>bêḍ</b> (yumurta, genel), <b>bêḍa</b> (bir yumurta), <b>tiffâḥ</b> (elma, genel), <b>tiffâḥa</b> (bir elma).</p><p>Yemek bitince ya da biri yerken <b>ṣaḥtên</b> (afiyet olsun) denir; cevabı <b>ʿala 'albak</b> (senin kalbine de).</p>",
note:"Tipik Şam kahvaltısı: fûl (bakla ezmesi), ḥummuṣ, labne, zeytin, zahter ile zeytinyağı, domates, salatalık ve sıcak ekmek. Cuma sabahı fûl ve fetteh yemek bir gelenektir.",

intro:"<p>Saat sormak: <b>is-sâʿa kam?</b> (saat kaç?). Cevap: <b>is-sâʿa tlâte</b> (saat üç).</p><ul><li><b>w rubʿ</b> = çeyrek geçiyor: is-sâʿa tlâte w rubʿ (3:15)</li><li><b>w nuṣṣ</b> = buçuk: is-sâʿa tlâte w nuṣṣ (3:30)</li><li><b>illa rubʿ</b> = çeyrek var: is-sâʿa arbaʿa illa rubʿ (3:45)</li><li><b>w tilt</b> = yirmi geçiyor (üçte bir saat), <b>illa tilt</b> = yirmi var</li><li><b>w ḫamse</b>, <b>w ʿaşara</b> = beş, on geçiyor</li></ul><p>«Saat kaçta?» için <b>êmta?</b> (ne zaman?) ya da <b>ʿa sâʿa kam?</b> sorulur. Cevap: <b>ʿa s-sâʿa tmânye</b> (saat sekizde).</p><p>Saat 1 için <b>waḥde</b> (dişil), 2 için <b>tintên</b> denir: is-sâʿa waḥde, is-sâʿa tintên. Diğer saatlerde normal sayılar kullanılır.</p>",

id:"a1-14", t:"Günler, aylar, mevsimler", s:"Haftanın günleri ve Türkçeyle ortak ay adları",
intro:"<p>Haftanın günleri <b>yôm</b> (gün) kelimesiyle ya da doğrudan el- takısıyla söylenir: <b>(yôm) il-ḫamîs</b> = perşembe. Günlerin çoğu sayılardan türemiştir: <b>t-tanên</b> (ikinci gün = pazartesi), <b>t-talâta</b> (üçüncü = salı)… Hafta pazar (<b>il-aḥad</b>, birinci gün) ile başlar.</p><p>Levant’ta ay adları <b>Süryanice kökenlidir</b> ve Türkçeyle şaşırtıcı derecede ortaktır: <b>Şbâṭ</b> (Şubat), <b>Âdâr</b> (Mart), <b>Nîsân</b> (Nisan), <b>Ḥzêrân</b> (Haziran), <b>Tammûz</b> (Temmuz), <b>Âb</b> (Ağustos), <b>Êlûl</b> (Eylül)! Osmanlı Türkçesinde de Teşrin ve Kânun adları kullanılıyordu.</p><p>«Pazartesi günü» demek için yine edat gerekmez: <b>bşûfak t-tanên</b> = Pazartesi görüşürüz. «Her gün» = <b>kill yôm</b>, «bu hafta» = <b>ha-j-jumʿa</b>.</p>",

intro:"<p>A1 aşamasını tüm soru kelimelerini toplayarak bitiriyoruz:</p><ul><li><b>şû</b> ne, <b>mîn</b> kim, <b>wên</b> nerede, <b>la-wên</b> nereye, <b>min wên</b> nereden</li><li><b>êmta</b> ne zaman, <b>lêş</b> neden, <b>kîf</b> nasıl</li><li><b>kam</b> kaç (sayılabilir), <b>'addêş</b> ne kadar</li><li><b>ayya / ayy</b> hangi: <b>ayya wâḥad?</b> (hangisi?)</li></ul><p>Olumsuzluk için Şam’da iki kelime vardır:</p><ul><li><b>mâ</b>: fiillerden ve fiil gibi davranan yapılardan önce (bidd-, ʿind-, maʿ-, fî): <b>mâ biddi</b>, <b>mâ ʿindi</b>, <b>mâ fî</b>.</li><li><b>miş</b>: isim, sıfat, zarf ve edat öbeklerinden önce: <b>miş mnîḥ</b> (iyi değil), <b>miş hôn</b> (burada değil), <b>miş ana</b> (ben değil).</li></ul><p>Zaten bildiğin cümleleri olumsuz yapmayı dene: <b>ana taʿbân</b> → <b>ana miş taʿbân</b>.</p>",
note:"«Lêş la'?» (Neden olmasın?) Şam’da teklif kabul ederken çok kullanılır. «Mâ baʿrif» (bilmiyorum) ise ilk öğreneceğin fiil kalıplarından olacak.",

intro:"<p>Önceki derste öğrendiğin düzensiz fiillerin geçmiş zamanı da kendine özgüdür. İyi haber: ekler aynıdır (-t, -ti, -et, -na, -tu, -u); yalnızca gövde değişir.</p><ul><li><b>İçi boş fiiller</b>: 3. şahısta uzun <b>â</b>, diğerlerinde kısa <b>i</b> ya da <b>u</b>: <b>râḥ</b> (gitti) → <b>riḥt</b> (gittim); <b>şâf</b> → <b>şift</b>; <b>nâm</b> → <b>nimt</b>; <b>'âl</b> → <b>'ilt</b>.</li><li><b>Sonu zayıf fiiller</b>: ek gelince <b>-ê-</b> çıkar: <b>ḥaka</b> → <b>ḥakêt</b> (konuştum); <b>ʿaṭa</b> → <b>ʿaṭêt</b>. <b>nisi</b> → <b>nsît</b> (unuttum).</li><li><b>Gelmek</b>: <b>ija</b> (geldi), <b>ijet</b> (geldi, k), <b>jît</b> (geldim), <b>jîna</b> (geldik), <b>iju</b> (geldiler).</li><li><b>Hemzeli</b>: <b>akal</b> → <b>akalt</b>, <b>aḫad</b> → <b>aḫadt</b>.</li></ul>",
note:"«Wên kint?» (Neredeydin?) Şam’da arkadaşlar arasında sık sorulan bir sorudur; cevap genellikle «Riḥt ʿa…» (… e gittim) ile başlar.",

g:{t:"Düzensiz fiillerin geçmişi",
b:"<p><b>kân</b> (olmak) fiili de içi boş bir fiildir: <b>kint</b> (idim), <b>kân</b> (idi), <b>kânet</b> (idi, k), <b>kinna</b> (idik), <b>kânu</b> (idiler). «Neredeydin?» = <b>wên kint?</b>. «Evdeydim» = <b>kint bi l-bêt</b>.</p><p>«Gittim» ve «geldim»den sonra yön için <b>ʿa</b> kullanılır: <b>riḥt ʿa l-jâmʿa</b> (üniversiteye gittim), <b>jît ʿa ş-Şâm</b> (Şam’a geldim).</p>",

{
id:"a2-5b", t:"Etken ortaç: râyiḥ, sâken, ʿâref", s:"Şam’da «gidiyorum, oturuyorum, biliyorum» demenin en doğal yolu",
intro:"<p>Şam Arapçasında çok sık kullanılan, ama ders kitaplarında az anlatılan bir yapı: <b>etken ortaç</b> (ism fâʿil). Fiilden türeyen ve «yapan, yapmakta olan» anlamı veren bir kelimedir; ama konuşmada <b>fiil gibi</b> kullanılır.</p><p>Form I fiillerde kalıp <b>CâCeC</b>’tir: <b>râḥ</b> (gitti) → <b>râyiḥ</b>, <b>sikin</b> (oturdu) → <b>sâken</b>, <b>ʿiref</b> (bildi) → <b>ʿâref</b>, <b>fihim</b> → <b>fâhem</b>. Diğer formlarda <b>m-</b> ile başlar: <b>sâfar</b> → <b>msâfer</b> (yolculukta), <b>iştağal</b> → <b>mištiğil</b>.</p><p>Ortaç bir sıfat gibi <b>cinsiyet ve sayıya</b> göre değişir: <b>râyiḥ</b> (erkek), <b>râyḥa</b> (kadın), <b>râyḥîn</b> (çoğul). Kişi eki almaz; kişi zamirden anlaşılır: <b>ana râyiḥ</b>, <b>inti râyḥa</b>, <b>niḥna râyḥîn</b>.</p><p>Anlamı fiilin türüne göre değişir:</p><ul><li><b>Hareket fiilleri</b> (gitmek, gelmek, dönmek): şu an ya da hemen olacak eylem: <b>ana râyiḥ ʿa s-sû'</b> = çarşıya gidiyorum / gideceğim. <b>jâyi!</b> = geliyorum!</li><li><b>Durum fiilleri</b> (oturmak, bilmek, anlamak, uyumak, giymek): şu anki durum: <b>sâken bi ş-Şâm</b> = Şam’da oturuyorum, <b>ʿâref</b> = biliyorum, <b>nâyim</b> = uyuyor.</li><li><b>Bazı fiillerde</b> «yapmış durumda» anlamı: <b>ana mâkel</b> = yemek yemiş durumdayım (tokum), <b>şâyfo</b> = onu görmüşüm.</li></ul><p>Olumsuzu <b>miş</b> ile yapılır, <b>mâ</b> ile değil: <b>ana miş fâhem</b> = anlamıyorum.</p>",
note:"Bir Şamlıya «Wên râyiḥ?» (Nereye gidiyorsun?) diye sorulduğunda sık duyacağın cevap «Mâ-ni râyiḥ maṭraḥ» (Bir yere gitmiyorum) ya da kısaca «Hôn, ʿa l-ḥâra» (Burada, mahallede) olur.",

g:{t:"Ortacın çekimi ve kullanımı",
b:"<p>Ortaç kişiye göre değil, <b>cinsiyet ve sayıya</b> göre çekilir. Bu yüzden tablosu kısadır: erkek, dişil, çoğul. «Ben» kadınsa <b>ana râyḥa</b>, erkekse <b>ana râyiḥ</b> der.</p><p><b>Geniş zamanla farkı:</b> <b>biskon bi ş-Şâm</b> «Şam’da otururum» (genel), <b>sâken bi ş-Şâm</b> «Şam’da oturuyorum» (şu anki durum). Şamlılar ikamet, bilgi ve hareket için ortacı çok daha sık kullanır. «Biliyor musun?» için en doğal soru <b>ʿâref?</b> / <b>ʿârfe?</b> şeklindedir.</p><p>Olumsuz: <b>miş râyiḥ</b>, <b>miş ʿârfe</b>. Şam’da zamirle birleşik kısa biçim de duyulur: <b>mâ-ni ʿâref</b> (bilmiyorum), <b>mâ-nak fâhem</b> (anlamıyorsun).</p>",

id:"a2-6", t:"Gelecek zaman: raḥ", s:"raḥ rûḥ = gideceğim; dilek kipi",
intro:"<p>Gelecek zaman için fiilin önüne <b>raḥ</b> konur: <b>raḥ rûḥ bukra</b> = yarın gideceğim. Ama dikkat: <b>raḥ</b>’dan sonra fiil <b>b-</b> öneksiz kullanılır. Bu öneksiz biçime <b>dilek kipi</b> (subjunctive) denir.</p><p>Dilek kipi aynı zamanda şu yapılardan sonra da kullanılır:</p><ul><li><b>bidd-</b>: <b>biddi rûḥ</b> (gitmek istiyorum)</li><li><b>lâzem</b>: <b>lâzem idros</b> (ders çalışmam lazım)</li><li><b>fî-</b> (yapabilmek): <b>fîni sâʿdak?</b> (sana yardım edebilir miyim?)</li><li><b>ta</b> (… mek için): <b>jît ta şûfak</b> (seni görmek için geldim)</li></ul><p>Dilek kipinin önekleri: <b>i-</b> (ben), <b>ti-</b> (sen, o-kadın), <b>yi-</b> (o-erkek, onlar), <b>ni-</b> (biz). Geniş zaman biçiminden <b>b</b>’yi atınca çoğu zaman bulursun: <b>btiktob → tiktob</b>, <b>mniktob → niktob</b>.</p><p>Olumsuz gelecek: <b>mâ raḥ</b>: <b>mâ raḥ rûḥ</b> = gitmeyeceğim.</p>",
note:"Şamlılar gelecekten bahsederken neredeyse her zaman «inşalla» (inşallah) ekler. «Bukra inşalla» (yarın inşallah) bazen «belki hiç» anlamına da gelir!",

b:"<p>Dilek kipi çekimi geniş zamanın <b>b-</b>’siz hâlidir. «Ben» biçiminde başa <b>i-</b> ya da hiçbir şey gelir: <b>raḥ iktob</b>, <b>raḥ rûḥ</b>, <b>raḥ âkol</b>.</p><p><b>raḥ</b> konuşmada kısalarak <b>ḥa-</b> ya da <b>raḥ</b> olarak duyulabilir. Ürdün ve Filistin’de <b>raḥ</b>, bazı yerlerde <b>ḥ-</b> kullanılır.</p>",

id:"a2-7", t:"Gereklilik ve yeterlilik", s:"lâzem, fî-, mumkin, ḥâbeb, aḥsan",
intro:"<p>Bu derste dilek kipinin önüne gelen «modal» yapıları öğreniyoruz:</p><ul><li><b>lâzem</b> = lazım, gerek: <b>lâzem rûḥ</b> (gitmem lazım). Değişmez, herkes için aynıdır: <b>lâzem trûḥ</b> (gitmen lazım).</li><li><b>fî- + ek</b> = yapabilmek: <b>fîni</b> (yapabilirim), <b>fîk</b> (yapabilirsin), <b>fîh</b> (yapabilir), <b>fîna</b> (yapabiliriz). <b>mâ fîni</b> = yapamam. (Şam’da <b>fîni</b> çok yaygındır; Lübnan’da da <b>fîyi</b>.)</li><li><b>mumkin</b> = mümkün, olabilir: <b>mumkin tsâʿedni?</b> (bana yardım edebilir misin?) Kibar rica için birebir.</li><li><b>aḥsan</b> = daha iyi: <b>aḥsan nrûḥ halla'</b> (şimdi gitsek iyi olur).</li><li><b>ḥâbeb</b> = sevmek, istemek: <b>ḥâbeb tîji?</b> (gelmek ister misin?)</li></ul><p>Yeni bir yapı da: <b>ʿam fakker</b> = düşünüyorum, <b>ʿam fakker rûḥ</b> = gitmeyi düşünüyorum.</p>",
note:"Bir Şamlıdan bir şey isterken «Mumkin…?» diye başlamak her zaman kibardır. Cevap çoğunlukla «Akîd, tikram ʿênak!» (Tabii, gözün için!) olur.",

id:"a2-8", t:"Emir kipi ve nesne ekleri", s:"taʿa, ḫod, ʿṭîni, lâ tiḥki — beni, seni, onu",
intro:"<p><b>Emir kipi</b> dilek kipinin önekini atarak yapılır: <b>tiktob</b> → <b>iktob!</b> (yaz!), <b>tiktbi</b> → <b>iktbi!</b> (yaz! — kadına), <b>tiktbu</b> → <b>iktbu!</b> (yazın!). İçi boş fiillerde: <b>rûḥ!</b> (git!), <b>şûf!</b> (bak!).</p><p>Düzensiz emirler: <b>taʿa / taʿi / taʿu</b> (gel!), <b>ḫod / ḫodi</b> (al!), <b>kûl / kûli</b> (ye!), <b>jîb / jîbi</b> (getir!).</p><p><b>Olumsuz emir</b> için <b>lâ</b> + dilek kipi: <b>lâ tiktob!</b> (yazma!), <b>lâ trûḥi!</b> (gitme! — kadına).</p><p><b>Nesne ekleri</b> (beni, seni, onu…) fiilin sonuna gelir ve iyelik eklerine çok benzer. Tek fark: «beni» = <b>-ni</b>: <b>ʿṭîni</b> (bana ver), <b>şûfni</b> (bana bak), <b>bḥibbak</b> (seni seviyorum), <b>şiftô</b> (onu gördüm).</p><p>«Bana / sana» (dolaylı nesne) için <b>-l-</b> eklenir: <b>jîb-li</b> (bana getir), <b>b'ûl-lak</b> (sana söylüyorum).</p>",
note:"«Ḫallîni» (bırak beni / izin ver) ve «ʿṭîni» (bana ver) Şam’da günde onlarca kez duyacağın emirlerdir. Rica için başına «law samaḥt» eklemeyi unutma.",

g:{t:"Nesne ekleri",
b:"<p>Fiile eklenen nesne ekleri: <b>-ni</b> beni, <b>-ak</b> seni (e), <b>-ik</b> seni (k), <b>-o</b> onu (e), <b>-a</b> onu (k), <b>-na</b> bizi, <b>-kon</b> sizi, <b>-hon</b> onları. Ünlüyle biten fiillerde <b>-o</b> eki uzar ve vurgu alır: <b>şiftu</b> (onları gördüm) değil, <b>şiftô</b> (onu gördüm). Bu küçük farklara zamanla alışacaksın.</p><p>Dolaylı nesne (-e/-a) için <b>-l-</b>: <b>-li</b> bana, <b>-lak</b> sana, <b>-lo</b> ona, <b>-la</b> ona (k), <b>-lna</b> bize, <b>-lkon</b> size, <b>-lhon</b> onlara.</p>",

{
id:"a2-8b", t:"Beğenmek, birisi, hiç kimse, birbiri", s:"ʿajabni, ḥada, wala ḥada, baʿḍ, la-ḥâli",
intro:"<p>Bu derste nesne eklerini (A2-8) kullanarak çok sık geçen birkaç yapıyı öğreniyoruz.</p><p><b>Beğenmek: ʿajab.</b> Türkçede «ben filmi beğendim» deriz; Arapçada ise <b>«film beni memnun etti»</b> denir: <b>ʿajabni l-film</b>. Yani beğenilen şey <b>özne</b>, beğenen kişi <b>nesne ekidir</b> (-ni, -ak, -o…). Beğenilen şey dişilse fiil de dişil olur: <b>ʿajbetni l-madîne</b> (şehir hoşuma gitti), çoğulsa çoğul: <b>ʿajabûni</b>. Geniş zaman: <b>byiʿjibni</b> (hoşuma gider), dişil: <b>btiʿjibni</b>. <b>bḥibb</b> (severim) daha güçlüdür; <b>ʿajab</b> «hoşuma gitti, beğendim» demektir.</p><p><b>Birisi / hiç kimse:</b> <b>ḥada</b> = birisi, kimse (soruda): <b>fî ḥada hôn?</b> (burada kimse var mı?). <b>wala ḥada</b> = hiç kimse: <b>mâ ija wala ḥada</b> (hiç kimse gelmedi). <b>kill ḥada</b> = herkes, <b>şî ḥada</b> = birisi.</p><p><b>Birbiri: baʿḍ.</b> <b>mnʿrif baʿḍ</b> (birbirimizi tanırız), <b>ḥabbu baʿḍ</b> (birbirlerini sevdiler). <b>maʿ baʿḍ</b> = birlikte.</p><p><b>Kendi: ḥâl-.</b> İyelik ekiyle: <b>la-ḥâli</b> = tek başıma, <b>la-ḥâlak</b> = tek başına; <b>ʿan ḥâli</b> = kendim hakkında; <b>dîr bâlak ʿala ḥâlak</b> = kendine iyi bak.</p>",
note:"«Dîr bâlak ʿala ḥâlak» (kendine dikkat et) Şam’da vedalaşırken çok sık söylenir; özellikle yolculuğa çıkan birine.",

g:{t:"ʿajab: beğenilen özne, beğenen nesne",
b:"<p>Kalıp: <b>ʿajab + kişinin nesne eki + beğenilen şey</b>. Fiil beğenilen şeye uyar: erkek <b>ʿajab</b>, dişil <b>ʿajbet</b>, çoğul <b>ʿajabu</b>. Ardından kim beğendiyse onun eki gelir.</p><p>Soru: <b>ʿajabak?</b> (hoşuna gitti mi?), <b>şû ʿajabak aktar şî?</b> (en çok neyi beğendin?). Olumsuz: <b>mâ ʿajabni</b>.</p><p><b>ḥada</b> olumsuz cümlede «kimse» olur: <b>mâ şift ḥada</b> (kimseyi görmedim). <b>wala ḥada</b> daha vurguludur: «hiç kimse».</p>",

id:"a2-9", t:"Alışveriş ve pazarlık", s:"Beden, renk, fiyat; «son fiyat ne?»",
intro:"<p>Şam’ın çarşıları (Ḥamîdiyye, Midḥat Bâşa, Bzûriyye) alışverişin yanında bir kültür deneyimidir. Bu derste giyim alışverişi ve pazarlık kalıplarını öğreniyoruz.</p><ul><li>Bir şey aramak: <b>ʿindak …?</b> (… var mı?), <b>ʿam dawwer ʿala …</b> (… arıyorum).</li><li>Beden: <b>'yâs</b> (ölçü/beden), <b>kbîr / wasaṭ / zğîr</b>. <b>fîni jarrbo?</b> (deneyebilir miyim?)</li><li>Fiyat: <b>'addêş ḥa''o?</b> (fiyatı ne kadar?), <b>âḫer siʿr?</b> (son fiyat?), <b>fîk tnazzel şwayy?</b> (biraz indirebilir misin?)</li><li>Karar: <b>bâḫdo</b> (alıyorum), <b>mâ biddi, şukran</b> (istemiyorum, teşekkürler), <b>baʿdên birjaʿ</b> (sonra dönerim).</li></ul><p><b>Karşılaştırma</b> sıfatı (daha …) <b>aCCaC</b> kalıbıyla yapılır: <b>rḫîṣ → arḫaṣ</b> (daha ucuz), <b>kbîr → akbar</b> (daha büyük), <b>ḥilu → aḥla</b> (daha güzel), <b>ğâli → ağla</b> (daha pahalı). «-den» = <b>min</b>: <b>hâd arḫaṣ min hadâk</b>.</p>",
note:"Pazarlıkta satıcı «ʿala ḥsâbak!» (senin hesabına / sana özel) ya da «ilak bi balâş» (sana bedava) diyebilir; bu nezaket kalıplarıdır, gerçekten bedava değildir!",

id:"a2-10", t:"Yol tarifi", s:"dûġri, yamîn, şmâl — sor ve anla",
intro:"<p>Yol sormak için kibar bir giriş: <b>ʿafwan, law samaḥt</b> (affedersiniz, rica etsem). Ardından: <b>wên …?</b> (… nerede?) ya da <b>kîf brûḥ ʿa …?</b> (… e nasıl giderim?).</p><p>Yol tarifinde en çok duyacağın kelimeler:</p><ul><li><b>dûġri</b> = dosdoğru, düz (Türkçe «doğru»dan!)</li><li><b>liff / furr yamîn</b> = sağa dön, <b>şmâl</b> = sol</li><li><b>ʿa awwal …</b> = ilk … de: <b>ʿa awwal ḥâra yamîn</b> (ilk sokaktan sağa)</li><li><b>la-ḥadd …</b> = … e kadar: <b>la-ḥadd il-işâra</b> (ışıklara kadar)</li><li><b>'arîb</b> (yakın), <b>baʿîd</b> (uzak), <b>ʿa ṭûl</b> (hemen, dümdüz)</li></ul><p>Emir kiplerini A2-8’de öğrendin; yol tarifinde hep onlar kullanılır: <b>kammel dûġri</b> (düz devam et), <b>irjaʿ</b> (geri dön), <b>'ṭaʿ iş-şâriʿ</b> (caddeyi geç).</p>",

id:"a2-11", t:"Ulaşım ve taksi", s:"servîs, taksi, otobüs; «burada dur»",
intro:"<p>Şam’da şehir içi ulaşım çoğunlukla <b>servîs</b> (dolmuş/minibüs) ve <b>taksi</b> ile yapılır. Şehirler arası yolculukta <b>bûlmân</b> (otobüs) ya da <b>karâj</b> (otogar) kelimelerini duyacaksın.</p><p>Taksiye binince önce gideceğin yeri söyle: <b>ʿa l-Mazze law samaḥt</b> (Mezze’ye lütfen). Fiyatı baştan sormak iyi bir alışkanlıktır: <b>'addêş la-hônîk?</b> (oraya ne kadar?). Taksimetre = <b>ʿaddâd</b>.</p><p>İnmek istediğinde: <b>nazzelni hôn</b> (beni burada indir) ya da <b>waʾʾef hôn law samaḥt</b> (burada dur lütfen). Dolmuşta inmek için şoföre kısaca <b>ʿala jamb!</b> (kenara!) ya da <b>hôn!</b> denir.</p><p>Bu derste ayrıca <b>«-den … -e»</b> yapısı: <b>min … la …</b>: <b>min Bâb Tûma la l-Mazze</b>.</p>",
note:"Şam servîslerinde parayı öndeki yolcuya uzatırsın, el el şoföre gider ve para üstü aynı yolla geri döner. «Waṣṣel ʿan iznak» (zahmet olmazsa ulaştır) diyerek parayı verirsin.",

g:{t:"min … la … ve süre sormak",
b:"<p>Yolculuk süresini sormak: <b>'addêş biddo wa't?</b> (ne kadar zaman ister/sürer?) ya da <b>kam da'î'a?</b> (kaç dakika?). Cevap: <b>rubʿ sâʿa</b> (çeyrek saat), <b>nuṣṣ sâʿa</b> (yarım saat), <b>sâʿa w nuṣṣ</b> (bir buçuk saat).</p><p><b>bi-</b> ile ulaşım aracı: <b>bi t-tâksi</b> (taksiyle), <b>bi s-servîs</b> (dolmuşla), <b>maşi</b> (yürüyerek).</p>",

{
id:"a2-12", t:"Restoranda", s:"Sipariş, garsona seslenmek, hesap",
intro:"<p>Şam restoranlarında masaya önce <b>meze</b> (mazât) gelir: ḥummuṣ, mtabbal, tabbûle, fattûş, kibbe… Sonra ızgaralar (<b>mşâwi</b>).</p><p>Garsona seslenmek için <b>ʿammo!</b> (amca!, yaşlıca biriyse), <b>ya ḥabîbi</b> ya da sadece <b>law samaḥt!</b> denir. Gençler arasında <b>ya ʿamm</b> da duyulur.</p><p>Sipariş kalıpları:</p><ul><li><b>biddna nuṭlob</b> = sipariş vermek istiyoruz</li><li><b>jîb-lna …</b> = bize … getir</li><li><b>bala …</b> = …sız: <b>bala baṣal</b> (soğansız), <b>bala sukkar</b> (şekersiz)</li><li><b>il-ḥsâb law samaḥt</b> = hesap lütfen</li></ul><p>Yemeği beğendiğini söylemek: <b>ṭayyeb ktîr!</b> (çok lezzetli!), <b>yislamu îdêk!</b> (ellerine sağlık! — aşçıya). Ödeme konusunda Şamlılar birbirleriyle tartışır: <b>ʿalayyi!</b> (benden!) — <b>la' wallah ʿalayyi!</b> (hayır vallahi benden!).</p>",
note:"Hesap kavgası (kim ödeyecek) Şam’da bir nezaket ritüelidir. Misafir olarak ödemeye çalışman beklenir ama ev sahibi genelde kazanır.",

g:{t:"bala, maʿ ve bi-",

id:"a2-13", t:"Ev ve eşyalar", s:"Odalar, eşyalar, kira; «taba'» ile sahiplik",
intro:"<p>Bu derste evi ve eşyaları öğreniyoruz. Ayrıca Şam’a özgü çok yaygın bir sahiplik kelimesi: <b>tabaʿ</b> (… e ait, … nın).</p><p>İyelik ekleri yerine <b>tabaʿ</b> de kullanılabilir: <b>bêti</b> = <b>il-bêt tabaʿi</b> (evim, benim olan ev). Özellikle yabancı kökenli ve uzun kelimelerde çok pratiktir: <b>it-tilifôn tabaʿi</b> (telefonum), <b>is-sayyâra tabaʿo</b> (onun arabası).</p><p><b>tabaʿ</b> dişil isimden sonra <b>tabaʿet</b>, çoğuldan sonra <b>tabaʿ</b> ya da <b>tabaʿûl</b> olabilir; konuşmada çoğu zaman sadece <b>tabaʿ</b> duyarsın.</p><p>Ev aramak: <b>ʿam dawwer ʿala bêt la l-ajâr</b> (kiralık ev arıyorum). <b>ajâr</b> = kira, <b>mafrûş</b> = eşyalı.</p>",
note:"Eski Şam evlerinin ortasında çeşmeli bir avlu (arḍ id-dâr) bulunur; etrafında limon ve yasemin ağaçları olur. Yasemin (yâsamîn) Şam’ın sembol çiçeğidir.",

g:{t:"tabaʿ ile sahiplik",

{
id:"a2-14", t:"Hava durumu ve kân", s:"Yağmur, kar, sıcak; «idi» ve «olacak»",
intro:"<p>Hava durumu Şam’da en sevilen sohbet konularından biridir. Hava = <b>ṭa's</b> (ya da <b>id-dinye</b>). <b>kîf iṭ-ṭa's l-yôm?</b> = Bugün hava nasıl?</p><ul><li><b>id-dinye ḥarr</b> (hava sıcak), <b>bard</b> (soğuk), <b>dâfi</b> (ılık), <b>ğêm</b> (bulutlu)</li><li><b>ʿam tişti</b> (yağmur yağıyor; kelimesi kelimesine: kış yapıyor!), <b>ʿam titlij</b> (kar yağıyor)</li><li><b>fî hawa</b> (rüzgâr var), <b>fî şams</b> (güneş var)</li></ul><p>Bu derste ayrıca <b>kân</b> (olmak) fiilinin geçmiş ve gelecek kullanımlarını tamamlıyoruz. İsim cümlelerinin geçmişi <b>kân</b> ile yapılır: <b>iṭ-ṭa's kân ḥilu</b> (hava güzeldi). Gelecekte <b>raḥ ykûn</b>: <b>bukra raḥ ykûn bard</b> (yarın soğuk olacak).</p><p><b>kân</b> ile <b>fî</b>, <b>ʿind-</b>, <b>bidd-</b> geçmiş olur: <b>kân fî talj</b> (kar vardı), <b>kân ʿindi wa't</b> (vaktim vardı).</p>",
note:"Şam kışları soğuk ve yağmurludur; ara sıra kar da yağar. Yazlar sıcak ama kurudur. Akşamüstü Kasyûn dağından esen serinlik Şamlıların gurur kaynağıdır.",

{
id:"a2-15", t:"Vücut ve doktorda", s:"Neren ağrıyor? «bîwjaʿni râsi»",
intro:"<p>Sağlıkla ilgili konuşabilmek önemlidir. Bu derste vücut kelimelerini ve doktorda kullanılan kalıpları öğreniyoruz.</p><p>«… ağrıyor» demek için <b>wajaʿ</b> (ağrımak) fiili <b>nesne ekiyle</b> kullanılır: <b>bîwjaʿni râsi</b> (başım ağrıyor; kelimesi kelimesine: başım beni ağrıtıyor). Ağrıyan organ dişilse fiil de dişil olur: <b>btûjaʿni baṭni</b> (karnım ağrıyor) — <b>baṭn</b> erkek olsa da konuşmada ikisi de duyulur; <b>îd</b> (el), <b>ijr</b> (ayak), <b>ʿên</b> (göz) dişildir: <b>btûjaʿni îdi</b>.</p><p>Diğer kalıplar:</p><ul><li><b>ʿindi ḥarâra</b> = ateşim var, <b>ʿindi rşiḥ</b> = nezleyim, <b>ʿindi saʿle</b> = öksürüğüm var</li><li><b>ana mariḍ / marîḍa</b> = hastayım</li><li><b>salâmtak!</b> = geçmiş olsun! (cevabı: <b>allâh ysallmak</b>)</li></ul>",

intro:"<p>Şam Arapçasında iki ana şart kelimesi vardır:</p><ul><li><b>iza</b> = eğer (gerçekleşebilir şart): <b>iza ijet, mnrûḥ sawa</b> = Gelirsen birlikte gideriz. <b>iza</b>’dan sonra fiil genellikle <b>geçmiş zaman</b> biçimindedir ama anlam gelecektir!</li><li><b>law</b> = eğer … seydi (gerçek dışı ya da hayalî şart): <b>law kint ʿindak, kint sâʿadtak</b> = Senin yanında olsaydım sana yardım ederdim.</li></ul><p>Sonuç kısmında:</p><ul><li><b>iza</b> ile: geniş zaman, gelecek (raḥ) ya da emir: <b>iza fîk, taʿa</b> (yapabilirsen gel).</li><li><b>law</b> ile: <b>kân + fiil</b>: <b>law baʿrif, kint 'iltillak</b> (bilseydim sana söylerdim).</li></ul><p>Ayrıca: <b>illa iza</b> = …medikçe / meğer ki, <b>ḥatta law</b> = … se bile, <b>ya rêt</b> = keşke.</p>",
note:"«Iza Allâh rad» (Allah isterse) ve «Law samaḥt» (izin verseydin = rica etsem) kalıpları şart yapısından gelir. Şamlılar ricayı bile şartla kibarlaştırır.",

g:{t:"iza ve law karşılaştırması",
b:"<p>Kural: gerçekleşmesi mümkün → <b>iza</b>; mümkün değil ya da geçmişte kalmış → <b>law</b>. Türkçede «-se» ile «-seydi» farkı gibi düşün.</p><p><b>iza</b> + <b>kân</b> sık kullanılır: <b>iza kân ʿindak wa't</b> (vaktin varsa), <b>iza kânet il-ḥâle mnîḥa</b> (durum iyiyse).</p>",
table:[["Şart","Sonuç","Anlam"],["إذا إجيت iza jît","منروح سوا mnrûḥ sawa","Gelirsen birlikte gideriz."],["إذا كان عندك وقت iza kân ʿindak wa't","تعا tʿa → taʿa","Vaktin varsa gel."],["إذا ما فيك iza mâ fîk","ما في مشكلة mâ fî muşkle","Yapamazsan sorun değil."],["لو بعرف law baʿrif","كنت قلتلك kint 'iltillak","Bilseydim sana söylerdim."],["لو عندي مصاري law ʿindi maṣâri","كنت سافرت kint sâfart","Param olsaydı yolculuğa çıkardım."]],
ex:[["إذا فاضي بكرا، منشرب قهوة","iza fâḍi bukra, mnişrab 'ahwe","Yarın boşsan kahve içeriz."],["لو بعرف، كنت جيت بكّير","law baʿrif, kint jît bakkîr","Bilseydim erken gelirdim."],["يا ريت عندي وقت أكتر","ya rêt ʿindi wa't aktar","Keşke daha çok vaktim olsa."],["حتّى لو تأخّرت، تعا","ḥatta law tʾaḫḫart, taʿa","Geç kalsan bile gel."]]},

id:"b1-5", t:"İlgi cümleleri: illi", s:"«… olan», «… dığı»: il-bint illi şiftha",
intro:"<p>Türkçede «gördüğüm kız», «gelen adam» gibi yapılar Arapçada <b>illi</b> ile kurulur. <b>illi</b> değişmez; cinsiyet ve sayıya göre çekilmez:</p><ul><li><b>ir-rijjâl illi ija</b> = gelen adam</li><li><b>il-bint illi şifta</b> = gördüğüm kız (kelimesi kelimesine: kız ki gördüm onu)</li><li><b>il-ktâb illi ʿaṭêtni yâh</b> = bana verdiğin kitap</li></ul><p>Önemli kural: illi’den sonraki cümlede, ana isim nesne ise bir <b>dönüş zamiri</b> bulunur: <b>şift-<u>a</u></b> (onu gördüm). Türkçede bu yoktur, dikkat et.</p><p>Ana isim <b>belirsizse</b> illi kullanılmaz: <b>bint şifta mbâriḥ</b> = dün gördüğüm bir kız.</p><p><b>illi</b> tek başına «… olan kişi/şey» anlamı da verir: <b>illi biddo yîji, ahlan w sahlan</b> = Gelmek isteyen hoş geldi. <b>kill şî illi biddak</b> = istediğin her şey.</p>",
note:"«Illi fât mât» (geçen öldü / geçmiş geçmişte kaldı) Şam’ın sevilen atasözlerinden biridir. Yapısı tam olarak bu dersteki illi kullanımıdır.",

g:{t:"illi ve dönüş zamiri",
b:"<p>illi cümlesinde ana isim fiilin nesnesiyse fiile nesne eki eklenir: <b>il-'amîṣ illi ştarêto</b> (aldığım gömlek: «gömlek ki aldım onu»). Edat nesnesi ise edata ek eklenir: <b>il-bêt illi sakant fî</b> (oturduğum ev: «ev ki oturdum onda»).</p><p><b>yâh</b>: İkinci bir nesne gerektiğinde kullanılır: <b>ʿaṭêtni yâh</b> (onu bana verdin), <b>jîb-li yâha</b> (onu bana getir, dişil).</p>",

id:"b1-6", t:"Bağlaçlar ve uzun cümleler", s:"bass, la'anno, ta, ḥatta, maʿ inno, minşân…",
intro:"<p>Akıcı konuşmanın sırrı cümleleri birbirine bağlayabilmektir. Bu derste en önemli bağlaçlar:</p><ul><li><b>w</b> (ve), <b>aw / willa</b> (veya / yoksa), <b>bass</b> (ama), <b>la'anno</b> (çünkü)</li><li><b>minşân</b> / <b>la-ḥatta</b> / <b>ta</b> (… için, … sın diye): <b>jît minşân şûfak</b></li><li><b>maʿ inno</b> (… e rağmen): <b>maʿ inno taʿbân, ija</b> (yorgun olmasına rağmen geldi)</li><li><b>qabl ma</b> → Şam: <b>'abl ma</b> (… meden önce), <b>baʿd ma</b> (… dikten sonra)</li><li><b>la-ḥatta</b> / <b>ḥatta</b> (… e kadar, hatta)</li><li><b>la-hêk</b> (bu yüzden), <b>yaʿni</b> (yani), <b>ʿa kill ḥâl</b> (her neyse)</li></ul><p><b>inno</b> (ki) bir fiil ya da fikirden sonra yeni cümle başlatır: <b>baʿrif inno ṣaʿb</b> (zor olduğunu biliyorum). Ek de alır: <b>innak</b>, <b>inna</b>, <b>inni</b>.</p>",
note:"«Yaʿni» Arapçanın en çok kullanılan dolgu kelimesidir; tıpkı Türkçedeki gibi, düşünürken boşluğu doldurmak için de kullanılır.",

g:{t:"'abl ma ve baʿd ma",
b:"<p><b>'abl ma</b>’dan sonra dilek kipi gelir (henüz olmamış): <b>'abl ma nâm</b> (uyumadan önce). <b>baʿd ma</b>’dan sonra ise genellikle geçmiş zaman: <b>baʿd ma ḫallaṣt</b> (bitirdikten sonra).</p><p>İsimle kullanırken <b>ma</b> düşer: <b>'abl il-akil</b> (yemekten önce), <b>baʿd iş-şuğul</b> (işten sonra).</p>",

{
id:"b1-7", t:"Hikâye anlatmak", s:"Olayları sıralamak: awwal şî, baʿdên, faj'a, bi l-âḫer",
intro:"<p>Bir olayı anlatmak, öğrendiğin tüm zamanları bir arada kullanmayı gerektirir. Arap hikâye anlatımında sıralama kelimeleri çok önemlidir:</p><ul><li><b>bi l-awwal</b> / <b>awwal şî</b> = önce, ilk olarak</li><li><b>baʿdên</b> / <b>w baʿdên</b> = sonra</li><li><b>faj'a</b> = birden, aniden</li><li><b>bi nafs il-wa't</b> = aynı anda</li><li><b>bi l-âḫer</b> / <b>âḫer şî</b> = sonunda</li><li><b>il-mhimm</b> = önemli olan, neyse (hikâyeye dönerken)</li></ul><p>Hikâyeyi başlatmak için: <b>marra…</b> (bir keresinde…), <b>bitʾaddar ʾil-lak şû ṣâr?</b> (ne oldu biliyor musun?) <b>ṣâr</b> = oldu, gerçekleşti. <b>şû ṣâr?</b> = Ne oldu?</p><p>Dinleyen kişinin tepkileri: <b>walla?</b> (vallahi mi?), <b>lak la'!</b> (hadi canım!), <b>w baʿdên?</b> (sonra?), <b>yâ ḥarâm!</b> (vah vah!).</p>",
note:"Şam’da «ḥakawâti» (hikâye anlatıcısı) geleneği hâlâ yaşar; Emevi Camii yakınındaki Naufara kahvesinde akşamları eski destanlar anlatılırdı.",

g:{t:"Hikâyede zamanların uyumu",
b:"<p>Ana olaylar <b>geçmiş zamanla</b>, arka plan <b>kân ʿam</b> ile, alışkanlıklar <b>kân + b-</b> ile anlatılır. Canlı anlatımda Araplar (Türkler gibi) bazen <b>geniş zamana</b> geçer: <b>w faj'a byîji wâḥad w bî'ûl-li…</b> (ve birden biri geliyor ve bana diyor ki…).</p><p>Aktarma: <b>'âl-li inno …</b> (bana … dedi), <b>'âlet inna taʿbâne</b> (yorgun olduğunu söyledi).</p>",

ex:[["مرّة كنت عم إمشي بالسوق","marra kint ʿam imşi bi s-sû'","Bir keresinde çarşıda yürüyordum."],["فجأة شفت صاحبي من المدرسة","faj'a şift ṣâḥbi min il-madrase","Birden okuldan arkadaşımı gördüm."],["قلّي إنّو ساكن بالشام هلّق","'âl-li inno sâken bi ş-Şâm halla'","Bana şimdi Şam’da oturduğunu söyledi."],["بالآخر شربنا قهوة سوا","bi l-âḫer şribna 'ahwe sawa","Sonunda birlikte kahve içtik."]]},

{
id:"b1-8", t:"Duygular ve görüşler", s:"Mutluluk, öfke, sıkıntı; «bḥiss», «baʿti'id»",
intro:"<p>Duyguları ifade etmek için en sık kullanılan yollar:</p><ul><li>Sıfatla: <b>ana mabsûṭ</b> (mutluyum), <b>zaʿlân</b> (üzgün/kırgın), <b>ʿaṣabi</b> (sinirli), <b>ḫâyef</b> (korkmuş), <b>mitḍâyi'</b> (sıkılmış, bunalmış), <b>muştâ'</b> (özlemiş).</li><li><b>bḥiss (b-)</b> = hissediyorum: <b>bḥiss bi taʿab</b> (yorgunluk hissediyorum), <b>bḥiss inni waḥîd</b> (yalnız olduğumu hissediyorum).</li><li><b>Kalıplar</b>: <b>'albi ʿam yudu'</b> (kalbim çarpıyor), <b>ṭliʿ ḫil'i</b> (canım burnumda/sabrım taştı), <b>'albi maksûr</b> (kalbim kırık).</li></ul><p>Görüş bildirmek:</p><ul><li><b>baʿti'id</b> / <b>bẓunn</b> = sanırım, bence</li><li><b>bi raʾyi</b> → <b>bi raʾyi</b> = bana göre</li><li><b>maʿak ḥa''</b> = haklısın, <b>mâ maʿak ḥa''</b> = haksızsın</li><li><b>ana maʿak</b> = sana katılıyorum, <b>ana ḍiddak</b> = sana karşıyım</li></ul>",
note:"«Iştaʾtillak!» (Seni özledim!) Şam’da en sıcak kelimelerden biridir. Cevabı: «W ana aktar!» (Ben daha çok!)",
words:[
["حَسّ / بْحِسّ","ḥass / bḥiss","Hissetmek / hissederim"],

intro:"<p>Telefonda konuşmak yabancı dilde en zor işlerden biridir: yüz ifadesi yok, ses bozulabilir. Kalıpları ezberlemek çok yardımcı olur.</p><ul><li>Açarken: <b>âlô!</b>, <b>naʿam?</b> (buyrun?), <b>mîn ʿam yiḥki?</b> (kim konuşuyor?)</li><li>Kendini tanıtmak: <b>maʿak Emre</b> (Emre ile konuşuyorsun = Ben Emre)</li><li>Birini istemek: <b>fîni iḥki maʿ Sâmi?</b> (Sami ile konuşabilir miyim?)</li><li>Bekletmek: <b>ṭawwel bâlak</b> / <b>laḥẓa</b> (bir dakika), <b>ḫallîk maʿi</b> (hatta kal)</li><li>Yok: <b>miş mawjûd</b> (burada değil), <b>biddak titrok risâle?</b> (mesaj bırakmak ister misin?)</li><li>Sorun: <b>mâ ʿam isamʿak mnîḥ</b> (seni iyi duyamıyorum), <b>il-ḫaṭṭ ʿam yi'ṭaʿ</b> (hat kesiliyor)</li></ul><p><b>ittaṣal / bittişil</b> = aramak (telefonla): <b>ittaṣil fiyyi</b> (beni ara), <b>raḥ ittişil fîk</b> (seni arayacağım).</p>",

intro:"<p>Meslek sormak: <b>şû btiştiğil?</b> (ne iş yapıyorsun?) ya da <b>şû şuğlak?</b> Cevap: <b>ana mhandes</b> (mühendisim), <b>biştiğil bi şirke</b> (bir şirkette çalışıyorum).</p><p>Meslek isimleri genelde iki kalıpla yapılır:</p><ul><li><b>CaCCâC</b> (zanaat): <b>ḫabbâz</b> (fırıncı), <b>najjâr</b> (marangoz), <b>ḥallâ'</b> (berber), <b>ṭabbâḫ</b> (aşçı)</li><li><b>muCaCCiC / mCaCCeC</b> (Form II ismi): <b>mʿallem</b> (öğretmen), <b>muḥâmi</b> (avukat), <b>mudîr</b> (müdür), <b>muwaẓẓaf</b> (memur)</li></ul><p>Dişil hep <b>-e/-a</b> ile: <b>mʿallme</b>, <b>mhandse</b>, <b>doktôra</b>.</p><p>İş hayatı kalıpları: <b>dawâm</b> (mesai), <b>râtib / maʿâş</b> (maaş), <b>ijâze</b> (izin), <b>ijtimâʿ</b> (toplantı), <b>ʿindi dawâm l-yôm</b> (bugün mesaim var).</p>",

intro:"<p>Sosyal hayatın temeli: birini davet etmek, teklif yapmak, kibarca reddetmek.</p><ul><li>Teklif: <b>şû raʾyak nrûḥ…?</b> (… gitsek ne dersin?), <b>ḥâbeb tîji?</b> (gelmek ister misin?), <b>yalla nrûḥ!</b> (hadi gidelim!)</li><li>Kabul: <b>akîd!</b>, <b>ʿala râsi!</b> (başım üstüne!), <b>fikra ḥilwe</b>, <b>mâşi</b> (tamam)</li><li>Kibar ret: <b>yâ rêt, bass…</b> (keşke ama…), <b>marra tânye inşalla</b> (inşallah başka sefere), <b>mâ fîni, maʿlêş</b> (yapamam, kusura bakma)</li><li>Zaman ayarlamak: <b>êmta bînâsbak?</b> (sana ne zaman uyar?), <b>bînâsbni</b> (bana uyar), <b>mnitlâ'a ʿind…</b> (… de buluşuruz)</li></ul><p><b>tlâ'a / bitlâ'a</b> (buluşmak), <b>ʿazam / byiʿzom</b> (davet etmek), <b>ʿazîme</b> (davet, ziyafet).</p><p>Şam’da davete giderken boş elle gidilmez: tatlı (<b>ḥilu</b>) ya da meyve götürülür. Ev sahibi kapıda <b>nawwartûna!</b> (bizi nurlandırdınız!) der.</p>",

g:{t:"Vurgu ve ünlem yapıları",
b:"<p>Samimi konuşmada vurgu için birkaç yapı kullanılır: <b>şû + sıfat!</b> = ne kadar …!: <b>şû ḥilu!</b> (ne güzel!). <b>ktîr ktîr</b> tekrar = çok çok. <b>wallah</b> (vallahi) cümle başında ya da sonunda doğruluk vurgusu yapar.</p><p><b>lak</b> / <b>lik</b> (Şam’a özgü dikkat çekme sözcüğü, «baksana»): <b>lak şû ʿam taʿmel?</b> (baksana, ne yapıyorsun?). Samimi ama biraz sert; yakın arkadaşlarla kullan.</p>",

{
id:"b2-5", t:"Rica, şikâyet ve özür", s:"Kibar ricadan resmî şikâyete, «sâmeḥni»",
intro:"<p>Bu derste ilişkileri yöneten üç dil işlevini çalışıyoruz.</p><p><b>Kibar rica</b> (yükselen kibarlık sırasıyla):</p><ul><li><b>ʿṭîni …</b> (ver) → <b>law samaḥt, ʿṭîni …</b> → <b>mumkin tʿṭîni …?</b> → <b>bitʾaddar tʿṭîni …?</b> (… verebilir misiniz?) → <b>iza mâ fî izʿâj …</b> (rahatsızlık olmazsa…)</li></ul><p><b>Şikâyet</b>:</p><ul><li><b>fî muşkle bi …</b> (… de bir sorun var), <b>ʿam yiṣîr …</b> (… oluyor), <b>hâd miş maʾbûl</b> (bu kabul edilemez), <b>biddi iḥki maʿ il-mudîr</b> (müdürle konuşmak istiyorum)</li></ul><p><b>Özür</b>:</p><ul><li><b>âsef</b> / <b>mitʾassef</b> (üzgünüm), <b>sâmeḥni</b> (beni affet), <b>mâ tâḫezni</b> (kusura bakma; kelimesi kelimesine: beni tutma), <b>il-ḥa'' ʿalayyi</b> (hata bende), <b>mâ kân ʾaṣdi</b> (kastım yoktu)</li></ul><p>Özre cevap: <b>mâ ṣâr şî</b> (bir şey olmadı), <b>mâ fî ʿalêk</b> (sende bir şey yok), <b>maʿlêş</b> (olsun).</p>",
note:"Şam’da «mâ tâḫezni» (kusura bakma) çok yaygındır; ama asıl kibarlık, özür dilemeden önce karşındakine «ahlan» deyip hatır sormaktır.",

g:{t:"Kibarlık basamakları",
b:"<p>Arapçada kibarlık genellikle cümleyi <b>uzatarak</b> ve <b>soru biçimine</b> sokarak yapılır. Emir → rica → soru → şartlı soru. Ayrıca hitap kelimeleri eklenir: <b>ustâz</b> (bey), <b>ḥajje</b> (hanım, yaşlı kadına), <b>ʿammo</b> (amca), <b>madâm</b> (hanımefendi).</p><p>Şikâyette bile Şamlılar nazik bir girişle başlar: <b>ʿafwan, mâ biddi izʿjak, bass…</b> (pardon, seni rahatsız etmek istemem ama…).</p>",
table:[["Seviye","Örnek"],["Emir","عطيني المي ʿṭîni l-mayy"],["Rica","لو سمحت، عطيني المي"],["Soru","ممكن تعطيني المي؟ mumkin tʿṭîni l-mayy?"],["Kibar soru","بتقدر تعطيني المي؟ bti'dar tʿṭîni l-mayy?"],["Çok kibar","إذا ما في إزعاج، ممكن…؟ iza mâ fî izʿâj, mumkin…?"]],
ex:[["عفوًا، في مشكلة بالغرفة","ʿafwan, fî muşkle bi l-ğurfe","Pardon, odada bir sorun var."],["المكيّف ما عم يشتغل","il-mukayyif mâ ʿam yiştiğil","Klima çalışmıyor."],["سامحني، ما كان قصدي","sâmeḥni, mâ kân ʾaṣdi","Affet beni, kastım değildi."],["ما صار شي، ولا يهمّك","mâ ṣâr şî, wala yhimmak","Bir şey olmadı, dert etme."]]},

{
id:"b2-6", t:"Fikir tartışmak", s:"Katılmak, itiraz, ikna: «min jiha… w min jiha tânye»",
intro:"<p>B2 seviyesinin kalbi: bir konu hakkında görüş bildirmek, gerekçelendirmek ve itiraz etmek. Bu derste tartışma dilinin araçlarını öğreniyorsun.</p><ul><li><b>Görüş</b>: <b>bi raʾyi</b>, <b>ana şâyef inno</b> (bence, görüyorum ki), <b>min wijhet naẓari</b> (benim bakış açımdan)</li><li><b>Katılma</b>: <b>maẓbûṭ</b> (doğru), <b>bi l-ẓabṭ</b> (aynen), <b>miyye bi l-miyye</b> (yüzde yüz)</li><li><b>Kısmen katılma</b>: <b>ṣaḥîḥ, bass…</b> (doğru ama…), <b>maʿak ḥa'' la-ḥadd mʿayyan</b> (bir yere kadar haklısın)</li><li><b>İtiraz</b>: <b>bi l-ʿaks</b> (tam tersine), <b>abadan</b> (asla, hiç de değil), <b>mâ bitwâfaʾ maʿak</b> (sana katılmıyorum)</li><li><b>Dengeleme</b>: <b>min jiha … w min jiha tânye …</b> (bir yandan… öte yandan…)</li><li><b>Örnek</b>: <b>masalan</b> (mesela), <b>ʿala sabîl il-misâl</b> (örneğin)</li></ul>",
note:"Şam’da tartışma tonu yüksek olabilir ama genelde dostanedir. Tartışma bitince «il-ḫilâf ma bifsid lil-wudd ʾaḍiyye» (görüş ayrılığı dostluğu bozmaz) denir.",

{
id:"b2-7", t:"Levant ağızlarının farkları", s:"Şam, Beyrut, Amman, Kudüs — aynı dil, farklı renkler",
intro:"<p>Şam ağzını öğrendin; artık bütün Levant’ta anlaşılırsın. Ama komşu ağızların farklarını bilmek hem anlamanı kolaylaştırır hem de konuştuğun kişiyi mutlu eder.</p><ul><li><b>Lübnan (Beyrut)</b>: «Bu» = <b>hayda / hayde</b> (Şam: hâd / hây). Kelime sonundaki -a sesi daha çok <b>-e</b>’ye kayar. Fransızca kelimeler bolca karışır: <b>merci</b>, <b>bonjour</b>, <b>ça va</b>. «Hi, kîfak, ça va?» Beyrut’un meşhur selamıdır.</li><li><b>Ürdün</b>: «Şimdi» = <b>hassa</b> (Şam: halla'). Kırsalda ق → <b>g</b>: <b>gâl</b> (dedi). Kadın «sen» = <b>inti</b>, erkek bazen <b>inte</b>. Hitap: <b>ya zalame</b>.</li><li><b>Filistin</b>: Şehirlerde ق hemze, köylerde <b>k</b> (kâl). «Ne?» için <b>êş</b> da duyulur. «İyi» = <b>mnîḥ</b> ya da <b>kwayyes</b>.</li></ul><p>Ortak çekirdek: <b>bidd-</b>, <b>ʿind-</b>, <b>fî</b>, <b>ʿam</b>, <b>raḥ</b>, <b>kîfak</b>, <b>wên</b>, <b>ktîr</b> — hepsinde aynı.</p>",
note:"Levant ağızları arasındaki fark, İstanbul Türkçesi ile Karadeniz ya da Ege ağızları arasındaki fark kadardır: herkes birbirini anlar ve farklarla şakalaşır.",

{
id:"b2-8", t:"Medya ve dizi dili", s:"Haber, dizi, sosyal medya; Fusha kalıplarını tanımak",
intro:"<p>Arapça dizi izlemek ve haber dinlemek, dil öğreniminin en keyifli yoludur. Suriye dizileri (<b>il-musalsalât is-sûriyye</b>) bütün Arap dünyasında sevilir; Şam ağzının yayılmasının bir sebebi de budur. <b>Bâb il-Ḥâra</b> gibi diziler eski Şam mahallelerini anlatır.</p><p><b>Haber dili</b> ise genellikle Fusha’dır. Tamamen anlamak için Fusha öğrenmen gerekmez ama sık kalıpları tanımalısın:</p><ul><li><b>sawfa</b> / <b>sa-</b> = -ecek (Şam: raḥ)</li><li><b>lan</b> = -meyecek, <b>lam</b> = -medi, <b>laysa</b> = değil (Şam: mâ / miş)</li><li><b>allazî / allatî</b> = ki, olan (Şam: illi)</li><li><b>hâzâ / hâzihi</b> = bu (Şam: hâd / hây)</li></ul><p>Sosyal medyada Araplar Latin harfleri ve rakamlarla yazar (3=ع, 7=ح, 2=hemze): <b>sho 3am t3mel?</b> = şû ʿam tiʿmel?</p>",
note:"Suriye dizilerinin altın çağı 2000’lerdi; «Bâb il-Ḥâra», «Ḍayʿa Ḍâyʿa» (komedi) ve «Ṣalâḥ id-Dîn» bütün Arap dünyasında izlendi. Şam ağzını kulağına yerleştirmek için bu dizileri Arapça altyazıyla izlemeyi dene.",

b:"<p>Şamlılar duyguları sık sık <b>«ölmek»</b> fiiliyle abartır: <b>mitt min…</b> (… den öldüm): <b>il-jûʿ</b> (açlık), <b>iḍ-ḍiḥk</b> (gülme), <b>il-bard</b> (soğuk), <b>it-taʿab</b> (yorgunluk). Ayrıca büyük sayılar (<b>alf, miyye</b>) ve <b>ʿumr</b> (ömür) ile abartılır: <b>ṣâr-li ʿumr ʿam istanna</b> (bir ömürdür bekliyorum).</p><p><b>mahḍûm</b> Şam ve Lübnan’da «sevimli, tatlı, komik» anlamında çok kullanılır; <b>saḫîf</b> ise tersidir.</p>",

intro:"<p>Kültürel akıcılık, doğru anda doğru kalıbı söyleyebilmektir. Bu kalıplar hem Müslüman hem Hristiyan Şamlılar arasında ortaktır.</p><ul><li><b>Bayramlar</b>: <b>kill sene w inta sâlem</b> (nice yıllara, erkeğe; kadına <b>w inti sâlme</b>) — cevabı <b>w inta sâlem</b>. <b>ʿîd mubârak</b> (bayramın kutlu olsun).</li><li><b>Ramazan</b>: <b>ramaḍân karîm</b> — cevabı <b>allâhu akram</b>. İftar öncesi <b>ṣôm maʾbûl</b> (orucun kabul olsun).</li><li><b>Düğün / nişan</b>: <b>mabrûk!</b>, <b>bi l-hana w il-banîn</b> (mutluluk ve evlatlarla), bekâr birine: <b>ʿuʾbâlak</b> / <b>ʿuʾbâlik</b> (sıra sende!).</li><li><b>Doğum</b>: <b>titrabba b-ʿizzkon</b> (sizin şanınızla büyüsün), <b>ḥamdilla ʿa s-salâme</b> (geçmiş olsun, hayırlı olsun).</li><li><b>Taziye</b>: <b>il-baʾiyye bi ḥayâtak</b> (kalanlar senin ömrüne / başın sağ olsun), <b>allâh yirḥamo</b> (Allah rahmet eylesin) — cevabı <b>w yirḥam amwâtak</b>.</li><li><b>Yolculuktan dönen birine</b>: <b>ḥamdilla ʿa s-salâme</b> — cevabı <b>allâh ysallmak</b>.</li></ul>",

intro:"<p>Ana dili konuşanları «doğal» gösteren şey, cümleler arasındaki küçük kelimelerdir: konuyu değiştiren, vurgulayan, zaman kazandıran, toparlayan ifadeler. Bunlara <b>söylem belirteçleri</b> denir.</p><ul><li><b>Konu açmak/değiştirmek</b>: <b>ʿa fikra</b> (aklıma gelmişken, bu arada), <b>il-mhimm</b> (neyse)</li><li><b>Düşünürken</b>: <b>yaʿni</b>, <b>ya'ni ʿam ʾûl…</b>, <b>şû ismo</b> (neydi adı), <b>kîf baddi ʾûl-lak</b> (nasıl desem)</li><li><b>Vurgu</b>: <b>aṣlan</b> (zaten, aslında), <b>ṭabʿan</b> (tabii), <b>bi l-ʿaks</b>, <b>ḥatta</b> (hatta)</li><li><b>Toparlamak</b>: <b>ʿa kill ḥâl</b> (her neyse), <b>il-ḫulâṣa</b> (özetle), <b>şû baddi ʾullak</b> (ne diyeyim)</li><li><b>Dinlerken</b>: <b>ê ê</b>, <b>maẓbûṭ</b>, <b>âh</b>, <b>w baʿdên?</b>, <b>ʿanjad?</b></li><li><b>Yumuşatma</b>: <b>taʾrîban</b> (aşağı yukarı), <b>şî</b> (bir … kadar): <b>şî ʿaşr dʾâyeʾ</b> (on dakika kadar)</li></ul>",

id:"c1-5", t:"Fusha ile köprü", s:"Haberi anlamak, resmî konuşma, iki dil arasında geçiş",
intro:"<p>Akıcı bir Şam Arapçası konuşanı olarak hayatında Fusha ile de karşılaşacaksın: haber bültenleri, resmî konuşmalar, tabelalar, kitaplar. Şamlıların kendisi de iki dil arasında sürekli geçiş yapar; buna dilbilimde <b>diglossia</b> denir.</p><p>Bu derste Fusha’nın en sık görülen ama Şam’da olmayan özelliklerini tanıyorsun:</p><ul><li><b>Sesler</b>: q (ق), ṡ (ث), ż (ذ) korunur: <b>qâla</b>, <b>ṡalâṡa</b>, <b>hâżâ</b>.</li><li><b>Sonekler</b>: kelime sonlarında hâl ekleri (<b>-u, -a, -i</b>), tenvin (<b>-un, -an</b>).</li><li><b>Fiil</b>: <b>b-</b> öneki yoktur: <b>yaktubu</b> (yazar), olumsuzlar <b>lâ, lam, lan</b>.</li><li><b>Kelimeler</b>: <b>al-âna</b> (halla'), <b>mâżâ</b> (şû), <b>ayna</b> (wên), <b>jayyid</b> (mnîḥ), <b>kaṡîr</b> (ktîr), <b>ʿindamâ</b> (lamma), <b>ayḍan</b> (kamân), <b>lâkin</b> (bass).</li></ul><p>Resmî bir ortamda konuşurken Şamlılar <b>«orta Arapça»</b> kullanır: dilbilgisi Şam’a ait, kelimeler daha Fusha. Bu senin de hedefin olabilir.</p>",
note:"Suriye’de okullar Fusha öğretir ve Suriyeliler Fusha’yı iyi konuşmalarıyla tanınır. Bir Şamlıyla Fusha konuşmaya çalışırsan genelde gülümser ve ağza geçer.",

g:{t:"Fusha → Şam dönüştürme tablosu",
b:"<p>Fusha bir cümleyi Şam’a çevirirken üç adım izle: (1) Fusha’ya özgü kelimeleri Şam karşılıklarıyla değiştir, (2) fiile <b>b-</b> ekle ve olumsuzları <b>mâ / miş</b> yap, (3) sesleri Şam’a göre söyle (q → ', ṡ → t/s).</p><p>Örnek: Fusha <b>mâżâ taf'alu al-âna?</b> → Şam <b>şû ʿam tiʿmel halla'?</b> (Şimdi ne yapıyorsun?)</p>",

intro:"<p>Kişisel bir anıyı ayrıntılı, duygusal ve akıcı biçimde anlatmak C1’in en güzel becerilerinden biridir. Bu derste bütün zaman yapılarını bir arada kullanacaksın.</p><p>Nostalji kalıpları:</p><ul><li><b>yâ ḥasra ʿa …</b> = ah o … nerede! / ne günlerdi!: <b>yâ ḥasra ʿa ayyâm zamân!</b> (ah o eski günler!)</li><li><b>bitzakkar</b> = hatırlıyorum: <b>bitzakkar lamma kinna…</b> (… dığımız zamanları hatırlıyorum)</li><li><b>mâ bansa</b> = unutmam: <b>ʿumri mâ bansa hadâk il-yôm</b> (o günü ömrüm boyunca unutmam)</li><li><b>kânet ayyâm</b> = ne günlerdi</li><li><b>iştaʾt la …</b> = … i özledim: <b>iştaʾt la-ş-Şâm</b> (Şam’ı özledim)</li><li><b>ḥanîn</b> = hasret, özlem</li></ul><p>Anlatımda zamanları değiştirerek canlılık kat: arka plan (<b>kân ʿam</b>), alışkanlık (<b>kân + b-</b>), olay (<b>geçmiş</b>), olaydan önce biten (<b>kân + geçmiş</b>) ve şimdiye bağlama (<b>la-halla'</b> = şimdiye kadar).</p>",

intro:"<p>Son derse ulaştın. Burada öğrendiğin her şeyi tek bir beceride birleştiriyoruz: <b>kendini uzun, akıcı ve doğal biçimde anlatmak</b>. Bir iş görüşmesi, bir sunum ya da yeni tanıştığın birine hayat hikâyeni anlatmak bunu gerektirir.</p><p>Uzun konuşmanın yapısı:</p><ul><li><b>Giriş</b>: <b>ḫallîni ʿarref ʿan ḥâli</b> (kendimi tanıtayım), <b>bi l-bidâye</b> (başlangıçta)</li><li><b>Gelişme</b>: <b>baʿd hêk</b> (ondan sonra), <b>min wa'ta</b> (o zamandan beri), <b>ṭûl ʿumri</b> (ömrüm boyunca)</li><li><b>Değerlendirme</b>: <b>it-tajrube ʿallamatni inno…</b> (tecrübe bana … öğretti), <b>ṣirt aʾwa</b> (daha güçlü oldum)</li><li><b>Kapanış</b>: <b>bi l-iḫtiṣâr</b> (kısacası), <b>w hêk</b> (ve böylece), <b>şukran ʿala waʾtkon</b> (vaktiniz için teşekkürler)</li></ul><p><b>Akıcılığı sürdürmek için</b>: her gün <b>Tekrar</b> destesini çalış, Şam dizileri izle, sesli mesajlar dinle ve hepsinden önemlisi <b>konuş</b>. Hata yapmaktan korkma: <b>illi mâ byiğlaṭ mâ byitʿallam</b> (hata yapmayan öğrenmez).</p>",

<script>(function(){
"use strict";
var STAGES = window.STAGES || [];
var $ = function(s, r){ return (r||document).querySelector(s); };
var app = $("#app");

/* ---------- course index ---------- */
var LESSONS = [];
STAGES.forEach(function(st, si){
  st.lessons.forEach(function(l, li){
    l.stage = st; l.si = si; l.li = li; l.gi = LESSONS.length;
    LESSONS.push(l);
  });
});
var BYID = {}; LESSONS.forEach(function(l){ BYID[l.id] = l; });

/* ---------- helpers ---------- */
var HARAKAT = /[ً-ْٰ]/g;
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function arTxt(s){ return state.settings.harakat ? s : String(s).replace(HARAKAT, ""); }
function AR(s, cls){ return '<span class="ar '+(cls||"")+'" lang="ar">'+esc(arTxt(s))+'</span>'; }
function TL(s){ return state.settings.translit ? '<span class="tl">'+esc(s)+'</span>' : ""; }
var ARRE = /[؀-ۿ]/;
function cell(c){ return ARRE.test(c) ? AR(c) : c; }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a, n){ return shuffle(a).slice(0, n); }
function today(){ var d=new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/86400000); }
function wkey(w){ return String(w[0]).replace(HARAKAT,"")+"|"+w[1]; }
function allWords(l){ return l.ek ? l.words.concat(l.ek) : l.words; }
function wordObj(w, l){ return {ar:w[0], tl:w[1], tr:w[2], nt:w[3]||"", lid:l.id}; }
function sentences(l){
  var out = [];
  if (l.g && l.g.ex) l.g.ex.forEach(function(e){ out.push({ar:e[0], tl:e[1], tr:e[2]}); });
  if (l.d) l.d.forEach(function(e){ out.push({ar:e[1], tl:e[2], tr:e[3]}); });
  return out;
}
var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
function spk(text, tl){ return '<button class="spk" type="button" data-say="'+esc(text)+'"'+(tl?' data-tl="'+esc(tl)+'"':'')+' aria-label="Dinle">'+SPK+'</button>'; }

/* ---------- state ---------- */
var DEFAULT = { v:1, updated:0, done:{}, exams:{}, srs:{}, xp:0, streak:{n:0,last:-1}, seen:{}, settings:{harakat:true, translit:true, rate:0.8} };
var state = JSON.parse(JSON.stringify(DEFAULT));
var LSKEY = "yalla-sami-progress-v1";
function merge(s){
  var n = JSON.parse(JSON.stringify(DEFAULT));
  if (!s || typeof s !== "object") return n;
  ["done","exams","srs","seen"].forEach(function(k){ if (s[k] && typeof s[k]==="object") n[k]=s[k]; });
  // eski kayıtlar: tekrar anahtarlarını harekesiz biçime taşı
  var srs = {}; Object.keys(n.srs).forEach(function(k){ var i = k.indexOf("|"); var nk = k.slice(0,i).replace(HARAKAT,"") + k.slice(i); if (!srs[nk] || srs[nk].b < n.srs[k].b) srs[nk] = n.srs[k]; }); n.srs = srs;
  if (typeof s.xp === "number") n.xp = s.xp;
  if (s.streak) n.streak = s.streak;
  if (s.settings) for (var k in s.settings) n.settings[k] = s.settings[k];
  n.updated = s.updated || 0;
  return n;
}
try { var raw = localStorage.getItem(LSKEY); if (raw) state = merge(JSON.parse(raw)); } catch(e){}

var remote = null, saveTimer = null, saving = false, pending = false;
function save(){
  state.updated = Date.now();
  try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 1500);
}
function pushRemote(){
  if (!remote) return;
  if (saving){ pending = true; return; }
  saving = true;
  remote.set(JSON.parse(JSON.stringify(state))).catch(function(){}).then(function(){
    saving = false; if (pending){ pending = false; pushRemote(); }
  });
}
(function initRemote(){
  if (!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user) return null;
    return user.id().then(function(id){
      if (!id) return;
      var ref = db.doc("data/users/" + id + "/progress");
      return ref.get().then(function(snap){
        remote = ref;
        var rs = snap.exists ? merge(snap.data()) : null;
        if (rs && rs.updated > state.updated){
          state = rs;
          try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch(e){}
          route();
          toast("İlerlemen hesabından yüklendi.");
        } else if (state.updated > 0){
          pushRemote();
        }
      });
    });
  }).catch(function(){});
})();

function addXP(n){
  state.xp += n;
  var t = today();
  if (state.streak.last !== t){
    state.streak.n = (state.streak.last === t-1) ? state.streak.n + 1 : 1;
    state.streak.last = t;
  }
}

/* ---------- unlocking ---------- */
function isDone(l){ return !!state.done[l.id]; }
function examPassed(st){ return !!state.exams[st.id]; }
function unlocked(l){
  if (l.gi === 0) return true;
  var prev = LESSONS[l.gi-1];
  if (!isDone(prev)) return false;
  if (l.li === 0 && l.si > 0) return examPassed(STAGES[l.si-1]);
  return true;
}
function examUnlocked(st){ return st.lessons.every(isDone); }
function nextTarget(){
  for (var i=0;i<LESSONS.length;i++){
    var l = LESSONS[i];
    if (l.li === 0 && l.si > 0 && !examPassed(STAGES[l.si-1])) return {exam:STAGES[l.si-1]};
    if (!isDone(l)) return {lesson:l};
  }
  var last = STAGES[STAGES.length-1];
  if (last && !examPassed(last)) return {exam:last};
  return null;
}

/* ---------- SRS (Leitner) ---------- */
var INTERVALS = [0, 1, 3, 7, 16, 35];
function srsAdd(l){
  var t = today();
  allWords(l).forEach(function(w){ var k = wkey(w); if (!state.srs[k]) state.srs[k] = {b:1, d:t+1, l:l.id}; });
}
function dueList(){
  var t = today(), out = [], seen = {};
  LESSONS.forEach(function(l){ allWords(l).forEach(function(w){
    var k = wkey(w); if (seen[k]) return; seen[k] = 1;
    var s = state.srs[k]; if (s && s.d <= t) out.push({w:w, l:l, s:s});
  }); });
  return out;
}

/* ---------- speech ---------- */
var voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  var vs = speechSynthesis.getVoices().filter(function(v){ return /^ar/i.test(v.lang); });
  var pref = ["ar-LB","ar-SY","ar-JO","ar-PS","ar-SA","ar-EG"];
  voice = null;
  for (var i=0;i<pref.length && !voice;i++) voice = vs.filter(function(v){ return v.lang.replace("_","-")===pref[i]; })[0] || null;
  if (!voice) voice = vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
/* Tarayıcı sesleri standart Arapça okur. Okunuşa bakarak yazımı Şam telaffuzuna
   yaklaştırırız: ق → hemze, ث → t/s, ذ → d/z, ظ → ḍ/z. Tek harfler (alfabe kartları) değişmez. */
function ttsWord(a, t){
  if (a.replace(HARAKAT, "").length < 2) return a;
  if (t.indexOf("q") < 0) a = a.replace(/^(و?ب?ال|و|ب|ل)?ق/, "$1أ").replace(/ق/g, "ء");
  if (/ث/.test(a)) a = a.replace(/ث/g, /s/.test(t) ? "س" : "ت");
  if (/ذ/.test(a)) a = a.replace(/ذ/g, /z/.test(t) ? "ز" : "د");
  if (/ظ/.test(a)) a = a.replace(/ظ/g, /ḍ/.test(t) ? "ض" : "ز");
  return a;
}
function ttsText(ar, tl){
  if (!tl) return ar;
  var at = String(ar).split(/\s+/), tt = String(tl).toLowerCase().split(/\s+/);
  return at.map(function(a, i){ return ttsWord(a, at.length === tt.length ? tt[i] : tt.join(" ")); }).join(" ");
}
function say(text, tl){
  if (!("speechSynthesis" in window)){ toast("Bu tarayıcı sesli okumayı desteklemiyor."); return; }
  if (!voice) pickVoice();
  if (!voice){ toast("Cihazında Arapça ses bulunamadı. Telefon ayarlarından Arapça metin okuma sesi ekleyebilirsin."); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(ttsText(text, tl));
  u.lang = voice.lang; u.voice = voice; u.rate = state.settings.rate || 0.8;
  speechSynthesis.speak(u);
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-say]"); if (b){ e.stopPropagation(); say(b.getAttribute("data-say"), b.getAttribute("data-tl")); }
});

var toastT;
function toast(msg){
  var t = $(".toast"); if (!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- chrome ---------- */
function header(){
  var due = dueList().length;
  $("#stats").innerHTML = '<span title="Günlük seri"><b>'+state.streak.n+'</b> gün</span><span><b>'+state.xp+'</b> XP</span>';
  var b = $("#nav-review .badge"); if (b){ b.textContent = due; b.hidden = !due; }
}
function setNav(name){
  document.querySelectorAll(".nav button").forEach(function(b){
    if (b.getAttribute("data-go")===name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
}

/* ---------- home ---------- */
function viewHome(){
  setNav("home");
  var nt = nextTarget();
  var doneN = LESSONS.filter(isDone).length;
  var h = '<div class="wrap"><section class="hero"><span class="ar" lang="ar">يلّا نحكي شامي</span>'+
    '<h1>Sıfırdan akıcı Şam Arapçasına</h1><p class="muted">'+LESSONS.length+' ders, '+STAGES.length+' aşama. Her ders bir öncekinin üstüne kurulur; sınavı %80 ile geçmeden sonraki ders açılmaz.</p>';
  if (nt){
    var title = nt.lesson ? (nt.lesson.stage.level+" · Ders "+(nt.lesson.li+1)+": "+nt.lesson.t) : (nt.exam.title+" — Aşama sınavı");
    h += '<div class="continue"><div class="grow"><small class="muted">'+(doneN?"Kaldığın yer":"Başlangıç")+'</small><br><b>'+esc(title)+'</b></div>'+
      '<button class="btn warm" data-open="'+(nt.lesson?("l:"+nt.lesson.id):("x:"+nt.exam.id))+'">'+(doneN?"Devam et":"Başla")+'</button></div>';
  } else {

    h += '<button class="lesson exam'+(ep?" done":"")+(eu?"":" locked")+(isNextX?" next":"")+'" '+(eu?'data-open="x:'+st.id+'"':'aria-disabled="true" data-locked="1"')+'>'+
      '<span class="num" lang="ar">امتحان</span><span class="t"><b>Aşama sınavı</b><small>'+esc(st.title)+' — tüm aşamadan 20 soru, geçme notu %80</small></span>'+

/* ---------- lesson ---------- */
var STEPS = ["Anlatım","Kelimeler","Dilbilgisi","Diyalog","Konuşma","Alıştırma","Sınav"];
var cur = null; // {l, step}
function openLesson(id, step){
  var l = BYID[id]; if (!l) return go("home");

}
function letterForms(ch){
  var nonJoin = "اأإآدذرزوةء".indexOf(ch) >= 0;

  return '<div class="letter-forms" aria-label="Harf biçimleri"><span title="Tek">'+ch+'</span><span title="Başta">'+ch+T+'</span><span title="Ortada">'+T+ch+T+'</span><span title="Sonda">'+T+ch+'</span></div>';

function renderLesson(){
  setNav("home");

    '<h1>'+esc(l.t)+'</h1><p class="muted">Ders '+(l.li+1)+' / '+l.stage.lessons.length+(l.s?" — "+esc(l.s):"")+'</p>'+
    '<nav class="steps" aria-label="Ders adımları">';
  STEPS.forEach(function(n, i){
    var can = i <= cur.seenMax || isDone(l);
    h += '<button '+(i===s?'aria-current="step"':'')+' class="'+(i<=cur.seenMax?"seen":"")+'" '+(can?'data-step="'+i+'"':'disabled')+'>'+(i+1)+'. '+n+'</button>';
  });
  h += '</nav></div><div id="stepbody"></div></div>';
  app.innerHTML = h;
  var b = $("#stepbody");
  if (s === 0) b.innerHTML = stepIntro(l);

  else if (s === 5) startQuiz(b, buildPractice(l), "practice");
  else if (s === 6) startQuiz(b, buildExam(l), "exam");

}

/* ---------- konuşma (rol yapma) ---------- */
function speakers(l){ var out = []; l.d.forEach(function(x){ if (out.indexOf(x[0]) < 0) out.push(x[0]); }); return out; }
function stepRole(l){

  for (var i = 0; i <= rp.i && i < l.d.length; i++){

function rpAdvance(){

function rpStart(role){

}
function nextBtn(label){ return '<div class="row"><button class="btn" data-next="1">'+(label||"Devam")+' →</button></div>'; }
function stepIntro(l){

function stepWords(l){
